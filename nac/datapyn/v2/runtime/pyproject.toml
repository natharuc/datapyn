[project]
name = "datapyn-runtime"
version = "0.1.0"
description = "DataPyn v2 execution runtime (JSON-RPC)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pandas>=2.0.0",
]

[project.scripts]
datapyn-runtime = "datapyn_runtime.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapyn_runtime"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
