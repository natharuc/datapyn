name: DataPyn Tauri - signed preview artifacts

on:
  workflow_dispatch:
    inputs:
      artifact_base_url:
        description: "HTTPS directory where these Tauri installers will be hosted (does not publish)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Signed Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            bundle: nsis
          - os: ubuntu-24.04
            platform: linux-x86_64
            bundle: appimage
    defaults:
      run:
        shell: bash
    env:
      DATAPYN_TAURI_UPDATER_PUBLIC_KEY: ${{ vars.DATAPYN_TAURI_UPDATER_PUBLIC_KEY }}
      DATAPYN_TAURI_UPDATER_ENDPOINT: ${{ vars.DATAPYN_TAURI_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"
      - name: Verify dedicated signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DATAPYN_TAURI_SIGNING_PRIVATE_KEY }}
        run: node --input-type=module -e "import {signedConfiguration} from './scripts/tauri/release.mjs'; signedConfiguration(process.env);"
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf unixodbc-dev libmariadb-dev
      - name: Install dependencies
        run: |
          uv sync --dev --frozen
          npm --prefix desktop ci
      - name: Validate
        run: |
          node --test scripts/tauri/release.test.mjs
          npm --prefix desktop test
          uv run pytest -c runtime_tests/pytest.ini runtime_tests -q
      - name: Build signed preview installer
        working-directory: desktop
        env:
          BUNDLE_TYPE: ${{ matrix.bundle }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.DATAPYN_TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.DATAPYN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --signed --ci --bundles "$BUNDLE_TYPE"
      - name: Generate platform manifest
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
        run: |
          VERSION=$(node --input-type=module -e "import {readFileSync} from 'node:fs'; console.log(JSON.parse(readFileSync('desktop/src-tauri/tauri.conf.json')).version)")
          node scripts/tauri/release.mjs manifest desktop/src-tauri/target/release/bundle "$PLATFORM" "$ARTIFACT_BASE_URL" "desktop/src-tauri/target/release/bundle/manifest-$PLATFORM.json" "$VERSION"
      - name: Preserve signed artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: datapyn-tauri-signed-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: desktop/src-tauri/target/release/bundle/

  manifest:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: datapyn-tauri-signed-*
          path: signed
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Combine platform manifests
        run: |
          node --input-type=module -e "import {readdirSync,readFileSync,writeFileSync} from 'node:fs';import {join} from 'node:path';const read=(dir)=>readdirSync(dir,{withFileTypes:true}).flatMap(item=>item.isDirectory()?read(join(dir,item.name)):item.name.startsWith('manifest-')&&item.name.endsWith('.json')?[JSON.parse(readFileSync(join(dir,item.name)))]:[]);const manifests=read('signed');if(manifests.length!==2||new Set(manifests.map(item=>item.version)).size!==1)throw new Error('Platform releases do not match');writeFileSync('latest.json',JSON.stringify({...manifests[0],platforms:Object.assign({},...manifests.map(item=>item.platforms))},null,2)+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: datapyn-tauri-preview-update-manifest
          path: latest.json
          if-no-files-found: error
