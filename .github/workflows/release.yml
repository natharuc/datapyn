name: Continuous Delivery - PSR

on:
  workflow_run:
    workflows: ["Continuous Integration - Tests"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: "Rebuild Windows/Linux/macOS artifacts for the current pyproject.toml version (no version bump)"
        required: false
        type: boolean
        default: false
      force:
        description: "Force a semver bump on manual run (patch, minor, or major). Ignored when rebuild_only is true."
        required: false
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

# default: least privileged permissions across all jobs
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # On workflow_dispatch the condition is always true (manual trigger).
    # On workflow_run we check that tests passed and commit is not from Actions.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_commit &&
        !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
        github.event.workflow_run.head_commit.author.email != 'actions@users.noreply.github.com'
      )
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    outputs:
      released: ${{ steps.set_release_outputs.outputs.released || steps.dry_run_version.outputs.released }}
      tag: ${{ steps.set_release_outputs.outputs.tag || steps.dry_run_version.outputs.tag }}
      version: ${{ steps.set_release_outputs.outputs.version || steps.dry_run_version.outputs.version }}

    steps:
      - name: Install SSH Client and add private key to ssh-agent
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      # On workflow_dispatch: checkout current branch.
      # On workflow_run: checkout the branch that triggered the tests.
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_branch }}
          ssh-key: ${{ (github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true) && secrets.ACTIONS_DEPLOY_KEY || '' }}

      - name: Setup | Force release branch to be at workflow sha
        if: github.event_name != 'workflow_dispatch'
        run: |
          git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Setup | Python
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup | Install uv
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Install dependencies
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true
        run: uv sync --dev

      # Official PSR docker action pip-installs latest GitPython on every run.
      # GitPython 3.1.60 removed Actor.name_email_regex, which PSR 10.5/10.6 still
      # uses while loading config. Run the locked CLI plus our compatibility shim.
      - name: Action | Semantic Version Release
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
          FORCE_LEVEL: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          extra=()
          if [ -n "${FORCE_LEVEL}" ]; then
            extra+=("--${FORCE_LEVEL}")
          fi
          uv run python scripts/ci_semantic_release.py -v version "${extra[@]}"

      - name: Fallback | Force patch when new commits did not match a release
        id: release_fallback
        if: steps.release.outputs.released != 'true' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions <actions@users.noreply.github.com>"
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          uv run python scripts/ci_semantic_release.py -v version --patch

      - name: Set release job outputs
        id: set_release_outputs
        if: github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true
        run: |
          if [ "${{ steps.release.outputs.released }}" = "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.release.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.release.outputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.release_fallback.outputs.released }}" = "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ steps.release_fallback.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.release_fallback.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Applied fallback patch release after no_release from commit parser."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Report | No semantic release (conventional commits required)
        if: steps.set_release_outputs.outputs.released != 'true' && (github.event_name != 'workflow_dispatch' || inputs.rebuild_only != true)
        run: |
          echo "::notice::Semantic Release did not bump the version (released=false)."
          echo "Commits on main since the last tag must use Conventional Commits, for example:"
          echo "  feat: new feature (minor bump)"
          echo "  fix: bug fix (patch bump)"
          echo "Free-form subjects like 'Improve grid performance' are mapped by scripts/datapyn_commit_parser.py."
          echo "Pure ci:/docs:/chore: merges may still skip artifacts unless fallback patch applies."
          echo "Manual recovery: Actions → Continuous Delivery - PSR → force: patch|minor|major"

      - name: Manual | Read version from pyproject.toml (rebuild only)
        id: dry_run_version
        if: github.event_name == 'workflow_dispatch' && inputs.rebuild_only == true
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$VERSION" ] || [ "$VERSION" = "0.0.0" ]; then
            echo "::error::Could not read valid version from pyproject.toml (got: '$VERSION')"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Rebuild only: version=$VERSION tag=v${VERSION} (no bump)"

  # Automatic runs that only merge ci:/chore:/docs: succeed the release job but skip artifacts.
  verify-release-published:
    needs: release
    if: github.event_name == 'workflow_run' && needs.release.outputs.released != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Fail when no release was published
        run: |
          echo "::error::Release artifacts were not built: semantic-release returned released=false."
          echo "Check commits since the last tag and scripts/datapyn_commit_parser.py heuristics."
          echo "Manual recovery: Actions → Continuous Delivery - PSR → force: patch|minor|major"
          exit 1

  build-windows-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Setup | Checkout Repository at Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Install Dependencies
        run: uv sync --dev

      - name: Build | Generate Windows application bundle
        run: uv run pyinstaller scripts/datapyn.spec --clean

      - name: Build | Package ZIP artifact
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.version }}"
          $zipName = "DataPyn-${version}-windows.zip"
          if (Test-Path $zipName) { Remove-Item $zipName -Force }
          Compress-Archive -Path "dist\DataPyn" -DestinationPath $zipName -CompressionLevel Optimal
          Write-Host "Created $zipName ($((Get-Item $zipName).Length / 1MB) MB)"

      - name: Build | Generate DataPyn-Setup.exe
        run: uv run pyinstaller installer/datapyn_setup.spec --clean

      - name: Build | Rename setup executable
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.version }}"
          Move-Item -Force "dist\DataPyn-Setup.exe" "DataPyn-Setup-${version}.exe"
          Copy-Item "DataPyn-Setup-${version}.exe" "DataPyn-Setup.exe"
          Write-Host "Setup executables ready"

      - name: Publish | Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            DataPyn-${{ needs.release.outputs.version }}-windows.zip
            DataPyn-Setup-${{ needs.release.outputs.version }}.exe
            DataPyn-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Setup | Checkout Repository at Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Disable ESM apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu-esm-*.list
          sudo sed -i '/esm\.ubuntu\.com/d' /etc/apt/sources.list

      - name: Setup | Disable Microsoft apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/packages.microsoft.com.list

      - name: Setup | Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            freeglut3-dev \
            libgl1 \
            libegl1 \
            libegl-mesa0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libxext6 \
            libx11-xcb1 \
            libnss3 \
            libnspr4 \
            libgbm1 \
            libasound2 \
            ruby \
            ruby-dev \
            build-essential

      - name: Setup | Install project dependencies
        run: uv sync --dev

      - name: Setup | Install fpm
        run: sudo gem install fpm --no-document

      - name: Build | Generate Linux binary with PyInstaller
        run: uv run pyinstaller scripts/datapyn.spec --clean

      - name: Build | Package .deb and tar.gz
        run: |
          chmod +x scripts/linux/package.sh scripts/linux/datapyn-wrapper.sh scripts/linux/postinst.sh scripts/linux/prerm.sh
          bash scripts/linux/package.sh "${{ needs.release.outputs.version }}"

      - name: Publish | Upload Linux installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            datapyn_${{ needs.release.outputs.version }}_amd64.deb
            datapyn_amd64.deb
            DataPyn-${{ needs.release.outputs.version }}-linux-x86_64.tar.gz
            DataPyn-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos-release:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: macos-14

    permissions:
      contents: write

    steps:
      - name: Setup | Checkout Repository at Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Install project dependencies
        run: uv sync --dev

      - name: Build | Generate datapyn.icns
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run python scripts/macos/generate_icns.py

      - name: Build | Generate macOS application bundle
        run: uv run pyinstaller scripts/datapyn.spec --clean

      - name: Build | Package unsigned DMG
        run: |
          chmod +x scripts/macos/package_dmg.sh
          bash scripts/macos/package_dmg.sh "${{ needs.release.outputs.version }}"

      - name: Publish | Upload macOS installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            DataPyn-${{ needs.release.outputs.version }}-macos-arm64.dmg
            DataPyn-macos-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

