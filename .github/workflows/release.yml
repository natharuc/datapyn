name: Continuous Delivery - PSR

on:
  workflow_run:
    workflows: ["Continuous Integration - Tests"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build sem publicar (para testes)"
        required: true
        default: true
        type: boolean

# default: least privileged permissions across all jobs
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # On workflow_dispatch the condition is always true (manual trigger).
    # On workflow_run we check that tests passed and commit is not from Actions.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_commit &&
        !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
        github.event.workflow_run.head_commit.author.email != 'actions@users.noreply.github.com'
      )
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released || steps.dry_run_version.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.dry_run_version.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.dry_run_version.outputs.version }}

    steps:
      - name: Install SSH Client and add private key to ssh-agent
        if: github.event_name != 'workflow_dispatch'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      # On workflow_dispatch: checkout current branch.
      # On workflow_run: checkout the branch that triggered the tests.
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_branch }}
          ssh-key: ${{ github.event_name != 'workflow_dispatch' && secrets.ACTIONS_DEPLOY_KEY || '' }}

      - name: Setup | Force release branch to be at workflow sha
        if: github.event_name != 'workflow_dispatch'
        run: |
          git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Action | Semantic Version Release
        id: release
        if: github.event_name != 'workflow_dispatch'
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      # On dry run, set fake outputs so the build jobs can execute
      - name: Dry Run | Set fake version outputs
        id: dry_run_version
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"

  build-windows-msi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Setup | Checkout Repository at Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Install Dependencies
        run: uv sync --dev

      - name: Build | Generate Windows EXE
        run: pyinstaller scripts/datapyn.spec --clean

      - name: Build | Create MSI Installer
        shell: pwsh
        run: |
          $version = "${{ needs.release.outputs.version }}"
          $sourceDir = "dist\DataPyn"
          $wixBin = "${env:WIX}bin\"

          # Harvest all files from PyInstaller output
          & "${wixBin}heat.exe" dir "$sourceDir" `
            -cg AppFiles -dr INSTALLFOLDER `
            -gg -sfrag -srd `
            -var var.SourceDir `
            -out heat.wxs

          # Compile WXS sources
          & "${wixBin}candle.exe" `
            -dSourceDir="$sourceDir" `
            -dProductVersion="$version" `
            scripts\installer.wxs heat.wxs

          # Link into MSI
          & "${wixBin}light.exe" `
            -ext WixUIExtension `
            -spdb `
            installer.wixobj heat.wixobj `
            -o "DataPyn-${version}-windows.msi"

      - name: Publish | Upload MSI to GitHub Release
        if: "!(github.event.inputs.dry_run == 'true')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: DataPyn-${{ needs.release.outputs.version }}-windows.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry Run | List generated artifacts
        if: github.event.inputs.dry_run == 'true'
        shell: pwsh
        run: |
          Write-Host "=== DRY RUN - MSI gerado com sucesso ==="
          Get-ChildItem -Path . -Filter *.msi | Format-Table Name, Length