name: Continuous Delivery - PSR

on:
  workflow_run:
    workflows: ["Continuous Integration - Tests"]
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build sem publicar (para testes)"
        required: true
        default: true
        type: boolean

# default: least privileged permissions across all jobs
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # On workflow_dispatch the condition is always true (manual trigger).
    # On workflow_run we check that tests passed and commit is not from Actions.
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_commit &&
        !contains(github.event.workflow_run.head_commit.message, '[skip ci]') &&
        github.event.workflow_run.head_commit.author.email != 'actions@users.noreply.github.com'
      )
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released || steps.dry_run_version.outputs.released }}
      tag: ${{ steps.release.outputs.tag || steps.dry_run_version.outputs.tag }}
      version: ${{ steps.release.outputs.version || steps.dry_run_version.outputs.version }}

    steps:
      - name: Install SSH Client and add private key to ssh-agent
        if: github.event_name != 'workflow_dispatch'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ACTIONS_DEPLOY_KEY }}

      # On workflow_dispatch: checkout current branch.
      # On workflow_run: checkout the branch that triggered the tests.
      - name: Setup | Checkout Repository on Release Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_branch }}
          ssh-key: ${{ github.event_name != 'workflow_dispatch' && secrets.ACTIONS_DEPLOY_KEY || '' }}

      - name: Setup | Force release branch to be at workflow sha
        if: github.event_name != 'workflow_dispatch'
        run: |
          git reset --hard ${{ github.event.workflow_run.head_sha }}

      - name: Action | Semantic Version Release
        id: release
        if: github.event_name != 'workflow_dispatch'
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: "github-actions"
          git_committer_email: "actions@users.noreply.github.com"

      # On dry run, set fake outputs so the build jobs can execute
      - name: Dry Run | Set fake version outputs
        id: dry_run_version
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"

  build-windows-msi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Setup | Checkout Repository at Release Tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Install Dependencies
        run: uv sync --dev

      - name: Build | Generate Windows EXE
        run: uv run pyinstaller scripts/datapyn.spec --clean

      - name: Build | Generate Installer Assets
        shell: pwsh
        run: |
          # Dialog bitmap (493x312, 24-bit BMP)
          # Banner bitmap (493x58, 24-bit BMP)
          # Using PowerShell to create simple placeholder bitmaps
          Add-Type -AssemblyName System.Drawing
          
          # Dialog background (493x312)
          $dialogBmp = New-Object System.Drawing.Bitmap(493, 312)
          $graphics = [System.Drawing.Graphics]::FromImage($dialogBmp)
          $graphics.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font("Arial", 24, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(0, 120, 212))
          $graphics.DrawString("DataPyn", $font, $brush, 150, 130)
          $font2 = New-Object System.Drawing.Font("Arial", 12)
          $brush2 = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::Gray)
          $graphics.DrawString("Data Analysis Tool", $font2, $brush2, 165, 170)
          $graphics.Dispose()
          $dialogBmp.Save("scripts\installer_dialog.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $dialogBmp.Dispose()
          
          # Banner (493x58)
          $bannerBmp = New-Object System.Drawing.Bitmap(493, 58)
          $graphics = [System.Drawing.Graphics]::FromImage($bannerBmp)
          $graphics.Clear([System.Drawing.Color]::White)
          $font = New-Object System.Drawing.Font("Arial", 16, [System.Drawing.FontStyle]::Bold)
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(0, 120, 212))
          $graphics.DrawString("DataPyn", $font, $brush, 10, 18)
          $graphics.Dispose()
          $bannerBmp.Save("scripts\installer_banner.bmp", [System.Drawing.Imaging.ImageFormat]::Bmp)
          $bannerBmp.Dispose()
          
          # Copy to dist folder where WiX expects them (relative to SourceDir)
          New-Item -ItemType Directory -Path "dist\scripts" -Force | Out-Null
          Copy-Item "scripts\installer_dialog.bmp" "dist\scripts\" -Force
          Copy-Item "scripts\installer_banner.bmp" "dist\scripts\" -Force
          Copy-Item "scripts\license.rtf" "dist\scripts\" -Force
          
          Write-Host "Installer assets generated and copied successfully"

      - name: Build | Create MSI Installer
        shell: pwsh
        run: |
          $rawVersion = "${{ needs.release.outputs.version }}"
          # MSI requires version format x.x.x.x (integers only)
          # Remove any suffix like -dryrun, -alpha, -beta, etc.
          $version = $rawVersion -replace '-.*$', ''
          # Ensure at least 3 parts (add .0 if needed)
          $parts = $version.Split('.')
          while ($parts.Count -lt 3) { $parts += '0' }
          $version = ($parts[0..2] -join '.') + '.0'
          Write-Host "MSI version: $version (from $rawVersion)"
          
          $sourceDir = "dist\DataPyn"
          $wixBin = "${env:WIX}bin\"

          # Harvest all files from PyInstaller output
          # -sreg: suppress SelfReg warnings (not applicable to PyInstaller output)
          # Exclude documentation, test files, and other unnecessary content
          & "${wixBin}heat.exe" dir "$sourceDir" `
            -cg AppFiles -dr INSTALLFOLDER `
            -gg -sfrag -srd -sreg `
            -var var.SourceDir `
            -out heat.wxs `
            -t:scripts\exclude_docs.xslt

          # Compile WXS sources
          & "${wixBin}candle.exe" `
            -dSourceDir="$sourceDir" `
            -dProductVersion="$version" `
            scripts\installer.wxs heat.wxs

          # Link into MSI
          # Suppress ICE validations that are expected/acceptable for per-user PyInstaller bundles:
          # -sice:ICE38 - Components in user profile should use registry KeyPath (not applicable for heat-generated files)
          # -sice:ICE60 - Files should have language specified (not applicable for PyInstaller DLLs)
          # -sice:ICE64 - Directories need RemoveFile entries (handled by Windows Installer)
          # -sice:ICE91 - Files in per-user folder won't copy to all users (expected behavior)
          & "${wixBin}light.exe" `
            -ext WixUIExtension `
            -spdb `
            -sice:ICE38 -sice:ICE60 -sice:ICE64 -sice:ICE91 `
            installer.wixobj heat.wixobj `
            -o "DataPyn-${rawVersion}-windows.msi"

      # Optional: Sign the MSI if a code signing certificate is configured
      # To use this, add these secrets to your GitHub repository:
      # - CODE_SIGNING_CERT_BASE64: Base64-encoded PFX certificate
      # - CODE_SIGNING_CERT_PASSWORD: Password for the PFX file
      - name: Build | Sign MSI (if certificate available)
        if: ${{ env.HAS_CODE_SIGNING_CERT == 'true' }}
        env:
          HAS_CODE_SIGNING_CERT: ${{ secrets.CODE_SIGNING_CERT_BASE64 != '' }}
          CODE_SIGNING_CERT_BASE64: ${{ secrets.CODE_SIGNING_CERT_BASE64 }}
          CODE_SIGNING_CERT_PASSWORD: ${{ secrets.CODE_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $rawVersion = "${{ needs.release.outputs.version }}"
          $msiPath = "DataPyn-${rawVersion}-windows.msi"
          
          # Decode certificate from base64
          $certBytes = [Convert]::FromBase64String($env:CODE_SIGNING_CERT_BASE64)
          $certPath = "codesigning.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          
          # Find signtool.exe
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter signtool.exe | 
                      Where-Object { $_.FullName -like "*x64*" } | 
                      Select-Object -First 1 -ExpandProperty FullName
          
          if ($signtool) {
            Write-Host "Signing MSI with signtool..."
            & $signtool sign /f $certPath /p $env:CODE_SIGNING_CERT_PASSWORD `
              /tr http://timestamp.digicert.com /td SHA256 /fd SHA256 `
              /d "DataPyn" /du "https://github.com/datapyn/datapyn" `
              $msiPath
            
            if ($LASTEXITCODE -eq 0) {
              Write-Host "MSI signed successfully!"
            } else {
              Write-Warning "Failed to sign MSI, continuing with unsigned installer"
            }
          } else {
            Write-Warning "signtool.exe not found, skipping signing"
          }
          
          # Clean up certificate file
          Remove-Item -Path $certPath -Force -ErrorAction SilentlyContinue

      - name: Publish | Upload MSI to GitHub Release
        if: "!(github.event.inputs.dry_run == 'true')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: DataPyn-${{ needs.release.outputs.version }}-windows.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry Run | List generated artifacts
        if: github.event.inputs.dry_run == 'true'
        shell: pwsh
        run: |
          Write-Host "=== DRY RUN - MSI gerado com sucesso ==="
          Get-ChildItem -Path . -Filter *.msi | Format-Table Name, Length
