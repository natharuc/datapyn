name: DataPyn telemetry admin - Cloudflare

on:
  push:
    branches: [main]
    paths: ["services/telemetry-admin/**", "scripts/cloudflare/telemetry-admin*", ".github/workflows/telemetry-admin.yml"]
  pull_request:
    paths: ["services/telemetry-admin/**", "scripts/cloudflare/telemetry-admin*", ".github/workflows/telemetry-admin.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after validation and exact domain/Access checks
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: datapyn-telemetry-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/telemetry-admin
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/telemetry-admin/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check public/app.js
      - run: node --test ../../scripts/cloudflare/telemetry-admin.test.mjs
      - run: npm run typecheck
      - run: npm run check

  preflight:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test scripts/cloudflare/telemetry-admin.test.mjs
      - name: Inspect exact domain and Access permissions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/cloudflare/telemetry-admin.mjs probe
      - name: Validate real telemetry query contracts without logging data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
        run: node --experimental-strip-types scripts/cloudflare/telemetry-admin-sql.mjs

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/telemetry-admin
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/telemetry-admin/package-lock.json
      - run: npm ci
      - name: Configure restricted Access and publish admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ADMIN_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          TELEMETRY_ADMIN_EMAILS: ${{ secrets.TELEMETRY_ADMIN_EMAILS }}
        run: npm run deploy
