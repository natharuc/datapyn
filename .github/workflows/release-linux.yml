name: Build Linux Installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build sem publicar (para testes)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux-deb:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - name: Setup | Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.release.tag_name }}

      - name: Setup | Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=0.0.0-dryrun" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Disable ESM apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu-esm-*.list
          sudo sed -i '/esm\.ubuntu\.com/d' /etc/apt/sources.list

      - name: Setup | Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libmariadb-dev \
            freeglut3-dev \
            libgl1 \
            libegl1 \
            libegl-mesa0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libxext6 \
            libx11-xcb1 \
            ruby \
            ruby-dev \
            build-essential

      - name: Setup | Install project dependencies
        run: uv sync --dev

      - name: Setup | Install fpm
        run: sudo gem install fpm --no-document

      - name: Build | Generate Linux binary with PyInstaller
        run: uv run pyinstaller scripts/datapyn.spec --clean

      - name: Build | Create .deb package
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Prepare directory structure for fpm
          mkdir -p pkg/opt/datapyn
          mkdir -p pkg/usr/share/applications

          cp -r dist/DataPyn/* pkg/opt/datapyn/
          cp scripts/linux/datapyn.desktop pkg/usr/share/applications/

          fpm -s dir -t deb \
            -n datapyn \
            -v "$VERSION" \
            --description "DataPyn - Data Analysis Tool" \
            --url "https://github.com/${{ github.repository }}" \
            --license "MIT" \
            --after-install scripts/linux/postinst.sh \
            --before-remove scripts/linux/prerm.sh \
            --depends libgl1 \
            --depends libegl1 \
            --depends libxkbcommon0 \
            --depends libdbus-1-3 \
            -C pkg \
            -p "datapyn_${VERSION}_amd64.deb" \
            .

      - name: Build | Create tar.gz archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf "DataPyn-${VERSION}-linux-x86_64.tar.gz" -C dist DataPyn

      - name: Publish | Upload installers to GitHub Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            datapyn_${{ steps.version.outputs.version }}_amd64.deb
            DataPyn-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry Run | List generated artifacts
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "=== DRY RUN - Instaladores gerados com sucesso ==="
          ls -lh *.deb *.tar.gz 2>/dev/null || echo "Nenhum artefato encontrado"
