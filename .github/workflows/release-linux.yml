name: Build Linux Installers (dry run)

# Packaging dry-run only. Real Linux artifacts are published by
# "Continuous Delivery - PSR" (build-linux-release) onto the same GitHub Release
# as Windows and macOS. Do not re-enable on: release — that duplicated the build.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build all Linux artifacts and upload workflow artifacts (never publishes a GitHub Release)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-linux-deb:
    runs-on: ubuntu-22.04

    steps:
      - name: Setup | Checkout Repository
        uses: actions/checkout@v4

      - name: Setup | Extract version
        id: version
        run: |
          VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-dryrun"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Dry-run packaging version=${VERSION} (GitHub Release upload is disabled in this workflow)"

      - name: Setup | Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Setup | Disable ESM apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu-esm-*.list
          sudo sed -i '/esm\.ubuntu\.com/d' /etc/apt/sources.list

      - name: Setup | Disable Microsoft apt sources
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/packages.microsoft.com.list

      - name: Setup | Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            freeglut3-dev \
            libgl1 \
            libegl1 \
            libegl-mesa0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libglib2.0-0 \
            libfontconfig1 \
            libxrender1 \
            libxext6 \
            libx11-xcb1 \
            libnss3 \
            libnspr4 \
            libgbm1 \
            libasound2 \
            fuse3 \
            libarchive-tools \
            rpm \
            zstd \
            ruby \
            ruby-dev \
            build-essential

      - name: Setup | Install pinned Type 2 AppImage toolchain
        shell: bash
        run: |
          set -euo pipefail
          source scripts/linux/appimage-toolchain.env
          test "${APPIMAGE_ARCHITECTURE}" = "x86_64"
          test "${APPIMAGE_RUNTIME_KIND}" = "type2"
          test "${APPIMAGETOOL_VERSION}" != "continuous"
          test "${APPIMAGE_RUNTIME_VERSION}" != "continuous"
          tool_path="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          runtime_path="${RUNNER_TEMP}/runtime-x86_64"
          curl --fail --location --retry 3 --output "${tool_path}" "${APPIMAGETOOL_URL}"
          printf '%s  %s\n' "${APPIMAGETOOL_SHA256}" "${tool_path}" | sha256sum --check --status
          curl --fail --location --retry 3 --output "${runtime_path}" "${APPIMAGE_RUNTIME_URL}"
          printf '%s  %s\n' "${APPIMAGE_RUNTIME_SHA256}" "${runtime_path}" | sha256sum --check --status
          chmod 755 "${tool_path}" "${runtime_path}"
          echo "DATAPYN_APPIMAGE_TOOL=${tool_path}" >> "${GITHUB_ENV}"
          echo "DATAPYN_APPIMAGE_RUNTIME=${runtime_path}" >> "${GITHUB_ENV}"

      - name: Verify | Require FUSE3 AppImage environment
        shell: bash
        run: |
          set -euo pipefail
          test -x "$(command -v fusermount3)"
          bash scripts/linux/package.sh --validate-fuse3-environment

      - name: Setup | Install project dependencies
        run: uv sync --dev

      - name: Setup | Install fpm
        run: sudo gem install fpm --no-document

      - name: Build | Generate Linux binary with PyInstaller
        run: uv run pyinstaller scripts/datapyn.spec --clean

      - name: Build | Package complete Linux release set
        env:
          DATAPYN_RELEASE_TAG: v${{ steps.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DATAPYN_PACMAN_COMMAND: ${{ github.workspace }}/scripts/linux/pacman-in-arch-container.sh
        run: |
          chmod +x scripts/linux/package.sh scripts/linux/release_metadata.py scripts/linux/datapyn-wrapper.sh scripts/linux/datapyn-appimage-apprun.sh scripts/linux/postinst.sh scripts/linux/prerm.sh scripts/linux/pacman-in-arch-container.sh
          bash scripts/linux/package.sh "${{ steps.version.outputs.version }}"

      - name: Verify | Gate complete Linux release metadata
        env:
          DATAPYN_RELEASE_TAG: v${{ steps.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bash scripts/linux/package.sh --validate-release \
            "${{ steps.version.outputs.version }}" "v${{ steps.version.outputs.version }}"

      - name: Verify | Run AppImage FUSE3 smoke tests
        env:
          DATAPYN_APPIMAGE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/linux/run_fuse3_smoke_container.sh "$DATAPYN_APPIMAGE_VERSION"

      - name: Verify | Run AppImage extract-and-run fallback on host
        env:
          DATAPYN_APPIMAGE_SMOKE_ARTIFACT: ${{ github.workspace }}/DataPyn-${{ steps.version.outputs.version }}-x86_64.AppImage
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox"
        run: uv run pytest tests/test_linux_appimage.py -m integration -k extract_and_run -q

      - name: Verify | Resolve Linux release asset list
        id: release_assets
        run: |
          {
            echo 'files<<EOF'
            bash scripts/linux/package.sh --print-release-assets "${{ steps.version.outputs.version }}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Dry Run | Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers-dryrun
          path: ${{ steps.release_assets.outputs.files }}
          if-no-files-found: error

      - name: Dry Run | List generated artifacts
        env:
          LINUX_RELEASE_ASSETS: ${{ steps.release_assets.outputs.files }}
        run: |
          echo "=== DRY RUN — Linux installers (not published to GitHub Releases) ==="
          while IFS= read -r asset; do
            [[ -z "$asset" ]] || ls -lh -- "$asset"
          done <<< "$LINUX_RELEASE_ASSETS"
