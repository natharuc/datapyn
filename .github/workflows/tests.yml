name: Continuous Integration - Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Disable ESM apt sources
        # Disable Ubuntu Pro ESM sources to prevent firewall blocks during apt-get operations
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu-esm-*.list
          sudo sed -i '/esm\.ubuntu\.com/d' /etc/apt/sources.list
      - name: Disable Microsoft apt sources
        # Disable Microsoft repos (azure-cli, prod) that return 403 Forbidden
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/packages.microsoft.com.list
      - name: Install MariaDB Connector/C dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Install OpenGL dependencies (Ubuntu)
        run: sudo apt-get install -y freeglut3-dev

      - name: Install Qt dependencies and Xvfb for headless testing
        run: |
          sudo apt-get install -y \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-cursor0 \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxrender1 \
            libxext6 \
            libx11-xcb1

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: install requirements
        run: uv sync --dev
      - name: run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox"
        run: |
          MAX_ATTEMPTS=3
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "=== Test attempt $ATTEMPT/$MAX_ATTEMPTS ==="

            set +e
            uv run pytest tests/ \
              --ignore=tests/test_visual_manual.py \
              --ignore=tests/test_gui.py \
              --ignore=tests/test_context_menu.py \
              --ignore=tests/test_shortcuts.py \
              --ignore=tests/test_file_management_feedback.py \
              --ignore=tests/test_file_operations.py \
              --ignore=tests/test_jupyter_import.py \
              --ignore=tests/test_new_tab_connection.py \
              --ignore=tests/test_session_panels_integration.py \
              --ignore=tests/test_session_restoration.py \
              -p no:faulthandler \
              -q 2>&1 | tee test_output.txt
            PIPE_EXIT=${PIPESTATUS[0]}
            set -e

            # pytest exit 0=passed, 1=failed, >=128=signal crash (SIGSEGV/SIGABRT do QWebEngine)
            if [ $PIPE_EXIT -eq 0 ]; then
              echo "All tests passed."
              exit 0
            elif [ $PIPE_EXIT -eq 1 ]; then
              # Testes falharam de verdade (assertions) - nao faz retry
              echo "Some tests failed."
              exit 1
            elif [ $PIPE_EXIT -ge 128 ]; then
              # Crash por sinal (SIGSEGV/SIGABRT) - pode ser cleanup ou mid-test
              if grep -q "passed" test_output.txt && ! grep -qP "\d+ failed" test_output.txt; then
                echo "Tests passed (QWebEngine crash ignored, exit code $PIPE_EXIT)"
                exit 0
              else
                echo "Qt/QWebEngine crash during tests (exit code $PIPE_EXIT, attempt $ATTEMPT/$MAX_ATTEMPTS)"
                if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                  echo "Retrying..."
                  sleep 2
                else
                  echo "All $MAX_ATTEMPTS attempts crashed. Failing build."
                  exit 1
                fi
              fi
            else
              exit $PIPE_EXIT
            fi
          done