name: Continuous Integration - Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Disable ESM apt sources
        # Disable Ubuntu Pro ESM sources to prevent firewall blocks during apt-get operations
        run: |
          sudo rm -f /etc/apt/sources.list.d/ubuntu-esm-*.list
          sudo sed -i '/esm\.ubuntu\.com/d' /etc/apt/sources.list
      - name: Install MariaDB Connector/C dependencies (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev

      - name: Install OpenGL dependencies (Ubuntu)
        run: sudo apt-get install -y freeglut3-dev

      - name: Install Qt dependencies and Xvfb for headless testing
        run: |
          sudo apt-get install -y \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-cursor0 \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libglib2.0-0 \
            libfontconfig1 \
            libdbus-1-3 \
            libxrender1 \
            libxext6 \
            libx11-xcb1

      - name: Setup | Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: install requirements
        run: uv sync --dev
      - name: run tests
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          set +e
          uv run pytest tests/ \
            --ignore=tests/test_visual_manual.py \
            --ignore=tests/test_gui.py \
            -p no:faulthandler \
            -q 2>&1 | tee test_output.txt
          PIPE_EXIT=${PIPESTATUS[0]}
          set -e
          # pytest exit 0=passed, 1=failed, >=128=signal crash (SIGSEGV/SIGABRT do QWebEngine cleanup)
          if [ $PIPE_EXIT -eq 0 ]; then
            echo "All tests passed."
            exit 0
          elif [ $PIPE_EXIT -eq 1 ]; then
            echo "Some tests failed."
            exit 1
          elif [ $PIPE_EXIT -ge 128 ]; then
            # Crash no cleanup do QWebEngine - verificar se os testes passaram via output
            if grep -q "passed" test_output.txt && ! grep -qP "\d+ failed" test_output.txt; then
              echo "Tests passed (QWebEngine cleanup crash ignored, exit code $PIPE_EXIT)"
              exit 0
            else
              echo "Tests failed (exit code $PIPE_EXIT)"
              exit 1
            fi
          else
            exit $PIPE_EXIT
          fi