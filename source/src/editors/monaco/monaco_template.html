        // Register standard completions (non-Copilot)
        // Store completions by category for context-aware filtering
        let allCompletions = [];
        let tableCompletions = [];
        let columnCompletions = [];
        let keywordCompletions = [];
        let columnsByTable = {}; // { tableName: [columns] }
        
        // Pending completion requests for async handling (legacy vars removed; use Maps above)
        
        // Register completion providers ONCE (called after Monaco is loaded)
        function registerStandardCompletionProviders() {
            // SQL provider - local cache first, Python enrichment async
            monaco.languages.registerCompletionItemProvider('sql', {
                triggerCharacters: ['.', ' ', ',', '(', '=', '@', '#'],
                provideCompletionItems: async function(model, position, context, token) {
                    const fullText = model.getValue();
                    const textBeforeCursor = model.getValueInRange({
                        startLineNumber: 1,
                        startColumn: 1,
                        endLineNumber: position.lineNumber,
                        endColumn: position.column
                    });
                    const invokeSuggest = context
                        && context.triggerKind === monaco.languages.CompletionTriggerKind.Invoke;
                    const crossDbCtx = parseSqlCrossDatabaseTableContext(textBeforeCursor);
                    const dotCtx = parseSqlDotContext(textBeforeCursor);
                    const range = getSqlCompletionReplaceRange(model, position, dotCtx, crossDbCtx);
                    const prefixFilter = getSqlCompletionPrefix(textBeforeCursor, dotCtx, crossDbCtx);
                    // Huge scripts: local-only suggestions — never ship fullText to Python/sqlglot.
                    if (isLargeDocument(model)) {
                        const localRaw = collectSqlLocalItems(textBeforeCursor, dotCtx, crossDbCtx, '');
                        const localItems = filterPrefixMatches(
                            localRaw,
                            prefixFilter,
                            80,
                            invokeSuggest
                        );
                        return {
                            suggestions: toMonacoSuggestions(localItems, range, prefixFilter)
                        };
                    }
                    const localRaw = collectSqlLocalItems(textBeforeCursor, dotCtx, crossDbCtx, fullText);
                    const wantsRemote = invokeSuggest;
                    const localItems = filterPrefixMatches(
                        localRaw,
                        prefixFilter,
                        dotCtx ? 200 : (wantsRemote ? 120 : 80),
                        invokeSuggest
                    );
                    const copilotItems = invokeSuggest ? buildCopilotSuggestItems(range) : [];
                    const buildSuggestions = function(items) {
                        return toMonacoSuggestions(
                            mergeCompletionItems(copilotItems, items),
                            range,
                            prefixFilter
                        );
                    };

                    if (token.isCancellationRequested) {
                        return { suggestions: buildSuggestions(localItems) };
                    }

                    if (!pyBridge) {
                        return { suggestions: buildSuggestions(localItems) };
                    }

                    // Local suggestions first — Python enrichment only on Ctrl+Space.
                    if (dotCtx && invokeSuggest) {
                        const remote = await createCompletionRequest('sql_context', (requestId) => {
                            pyBridge.requestSqlContext(
                                fullText,
                                dotCtx.qualifier,
                                position.lineNumber,
                                position.column,
                                requestId
                            );
                        });
                        if (token.isCancellationRequested) {
                            return { suggestions: buildSuggestions(localItems) };
                        }
                        const filteredRemote = filterRemoteCompletionItems(
                            remote,
                            textBeforeCursor,
                            dotCtx
                        );
                        const merged = mergeSuggestions(filteredRemote, localItems);
                        return {
                            suggestions: buildSuggestions(merged.length ? merged : localItems),
                            incomplete: false
                        };
                    }

                    if (wantsRemote) {
                        const remote = await debouncedRemote('sql', (requestId) => {
                            pyBridge.requestSqlCompletion(
                                fullText,
                                position.lineNumber,
                                position.column,
                                requestId
                            );
                        }, token);
                        if (token.isCancellationRequested) {
                            return { suggestions: buildSuggestions(localItems) };
                        }
                        const filteredRemote = filterRemoteCompletionItems(
                            remote,
                            textBeforeCursor,
                            null
                        );
                        const merged = mergeSuggestions(filteredRemote, localItems);
                        return {
                            suggestions: buildSuggestions(merged.length ? merged : localItems)
                        };
                    }

                    return { suggestions: buildSuggestions(localItems) };
                }
            });
            
            monaco.languages.registerCompletionItemProvider('python', {
                triggerCharacters: ['.', '_'],
                provideCompletionItems: async function(model, position, context, token) {
                    const invokeSuggest = context
                        && context.triggerKind === monaco.languages.CompletionTriggerKind.Invoke;

                    const replaceRange = getCompletionReplaceRange(model, position);
                    const range = {
                        startLineNumber: replaceRange.startLineNumber,
                        endLineNumber: replaceRange.endLineNumber,
                        startColumn: replaceRange.startColumn,
                        endColumn: replaceRange.endColumn
                    };
                    const word = model.getWordUntilPosition(position);

                    const fullText = model.getValue();
                    const textBeforeCursor = model.getValueInRange({
                        startLineNumber: 1,
                        startColumn: 1,
                        endLineNumber: position.lineNumber,
                        endColumn: position.column
                    });
                    const wordPrefix = getCurrentWordPrefix(textBeforeCursor);
                    const localItems = filterPrefixMatches(
                        filterCompletionsByContext(textBeforeCursor, 'python'),
                        wordPrefix,
                        80,
                        invokeSuggest
                    );
                    const localSuggestions = toMonacoSuggestions(localItems, range);

                    const wordLen = Math.max(
                        (word.word || '').length,
                        (wordPrefix || '').length
                    );
                    if (!invokeSuggest && wordLen < 1) {
                        return { suggestions: [] };
                    }

                    if (token.isCancellationRequested) {
                        return { suggestions: localSuggestions };
                    }

                    const lines = textBeforeCursor.split('\n');
                    const currentLine = lines[lines.length - 1];
                    const dotMatch = currentLine.match(/(\w+)\.$/);

                    if (pyBridge && (dotMatch || wordLen >= 1 || invokeSuggest)) {
                        const remote = await debouncedRemote('python', (requestId) => {
                            pyBridge.requestPythonCompletion(fullText, position.lineNumber, position.column, requestId);
                        }, token);
                        if (token.isCancellationRequested) {
                            return { suggestions: localSuggestions };
                        }
                        const merged = mergeSuggestions(remote || [], localItems);
                        return {
                            suggestions: toMonacoSuggestions(
                                merged.length ? merged : localItems,
                                range
                            )
                        };
                    }

                    return { suggestions: localSuggestions };
                }
            });
        }
        
        function normalizeSchemaKey(key) {
            return String(key || '').toLowerCase().replace(/[\[\]`"]/g, '');
        }

        let sqlSchemaDbType = '';

        function columnsForTableKeys(columnsMap, fullKey, fallbackKey, name) {
            const candidates = [fullKey, fallbackKey, name].filter(Boolean);
            for (let i = 0; i < candidates.length; i++) {
                const cols = columnsMap[candidates[i]];
                if (cols && cols.length) {
                    return cols;
                }
            }
            const wanted = candidates.map(normalizeSchemaKey);
            const keys = Object.keys(columnsMap || {});
            for (let i = 0; i < keys.length; i++) {
                if (wanted.indexOf(normalizeSchemaKey(keys[i])) >= 0 && columnsMap[keys[i]] && columnsMap[keys[i]].length) {
                    return columnsMap[keys[i]];
                }
            }
            return [];
        }

        function registerSqlSchemaIndex(schema) {
            schema = schema || {};
            sqlSchemaDbType = String(schema.db_type || '').toLowerCase();
            sqlSchemaIndex = {
                columnsByKey: {},
                tableItems: [],
                schemaItems: [],
                schemaNames: new Set(),
                currentDatabase: schema.database || '',
                currentSchema: schema.current_schema || '',
                catalogSchemas: schema.catalog_schemas || {},
                catalogs: schema.databases || []
            };
            const columnsMap = schema.columns || {};
            const tables = schema.tables || [];
            const catalogSchemas = schema.catalog_schemas || {};
            const schemaLabelSet = new Set();
            Object.keys(catalogSchemas).forEach(function(catalog) {
                (catalogSchemas[catalog] || []).forEach(function(schemaName) {
                    if (schemaName) {
                        sqlSchemaIndex.schemaNames.add(normalizeSchemaKey(schemaName));
                        schemaLabelSet.add(schemaName);
                    }
                });
            });

            tables.forEach(function(table) {
                const name = typeof table === 'string' ? table : (table.name || '');
                if (!name) {
                    return;
                }
                const catalog = typeof table === 'object' ? (table.catalog || '') : '';
                const tableKey = typeof table === 'object' ? (table.key || '') : '';
                const rawSchemaName = typeof table === 'object' ? (table.schema || '') : '';
                const fallbackKey = rawSchemaName ? (rawSchemaName + '.' + name) : name;
                const fullKey = tableKey || (
                    catalog && rawSchemaName
                        ? (catalog + '.' + rawSchemaName + '.' + name)
                        : fallbackKey
                );
                const schemaName = inferSqlServerTableSchemaName(table, name, tableKey, fallbackKey);
                if (schemaName) {
                    sqlSchemaIndex.schemaNames.add(normalizeSchemaKey(schemaName));
                    schemaLabelSet.add(schemaName);
                }
                const tableDatabase = typeof table === 'object' ? (table.database || '') : '';
                const tableCatalog = typeof table === 'object' ? (table.catalog || '') : '';
                const cols = columnsForTableKeys(columnsMap, fullKey, fallbackKey, name);
                const columnItems = cols.map(function(col) {
                    const colName = col.name || col;
                    const colType = col.display_type || col.type || '';
                    return {
                        label: colName,
                        kind: 'field',
                        insertText: quoteSqlIdentifierIfNeeded(colName),
                        detail: colType ? (name + ' • ' + colType) : name,
                        filterText: colName,
                        category: 'column',
                        table: name
                    };
                });
                const keys = new Set([
                    normalizeSchemaKey(fullKey),
                    normalizeSchemaKey(fallbackKey),
                    normalizeSchemaKey(name)
                ]);
                keys.forEach(function(k) {
                    if (!k) {
                        return;
                    }
                    const existing = sqlSchemaIndex.columnsByKey[k];
                    if (existing && existing.length && !columnItems.length) {
                        return;
                    }
                    if (!existing || !existing.length) {
                        sqlSchemaIndex.columnsByKey[k] = columnItems;
                    }
                });
                const filterText = tableDatabase ? (tableDatabase + '..' + name) : name;
                const displayLabel = isDatabricksSchema()
                    ? databricksTableLabel(tableCatalog, rawSchemaName, name)
                    : name;
                const insertValue = isDatabricksSchema()
                    ? displayLabel
                    : quoteSqlIdentifierIfNeeded(name);
                sqlSchemaIndex.tableItems.push({
                    label: displayLabel,
                    kind: 'class',
                    insertText: insertValue,
                    detail: tableDatabase ? (tableDatabase + '..' + name) : fallbackKey,
                    category: 'table',
                    database: tableDatabase || tableCatalog,
                    catalog: tableCatalog,
                    schemaName: schemaName,
                    filterText: displayLabel + ' ' + filterText
                });
            });

            schemaLabelSet.forEach(function(schemaName) {
                sqlSchemaIndex.schemaItems.push({
                    label: schemaName,
                    kind: 'module',
                    insertText: quoteSqlIdentifierIfNeeded(schemaName),
                    detail: 'schema',
                    filterText: schemaName,
                    category: 'schema'
                });
            });

            Object.keys(columnsMap).forEach(function(key) {
                const nk = normalizeSchemaKey(key);
                if (sqlSchemaIndex.columnsByKey[nk]) {
                    return;
                }
                const cols = columnsMap[key] || [];
                sqlSchemaIndex.columnsByKey[nk] = cols.map(function(col) {
                    const colName = col.name || col;
                    return {
                        label: colName,
                        kind: 'field',
                        insertText: quoteSqlIdentifierIfNeeded(colName),
                        detail: col.display_type || col.type || '',
                        category: 'column',
                        table: key
                    };
                });
            });

            console.log(
                '[MONACO] sqlSchemaIndex:',
                sqlSchemaIndex.tableItems.length,
                'tables,',
                Object.keys(sqlSchemaIndex.columnsByKey).length,
                'column keys'
            );
        }

        function collectScopedColumnItems(fullText) {
            const aliasMap = extractSqlAliases(fullText || '');
            const tableKeys = [];
            const seenKeys = new Set();
            Object.keys(aliasMap).forEach(function(aliasOrTable) {
                const tableKey = aliasMap[aliasOrTable];
                if (tableKey && !seenKeys.has(tableKey)) {
                    seenKeys.add(tableKey);
                    tableKeys.push(tableKey);
                }
            });
            const items = [];
            const seenCol = new Set();
            tableKeys.forEach(function(tableKey) {
                lookupColumnsForTable(tableKey).forEach(function(c) {
                    const label = String(c.label || '');
                    const dedupe = label.toLowerCase() + '|' + String(c.table || tableKey || '').toLowerCase();
                    if (!label || seenCol.has(dedupe)) {
                        return;
                    }
                    seenCol.add(dedupe);
                    items.push({
                        label: c.label,
                        kind: 'field',
                        insertText: c.insertText || c.label,
                        detail: c.detail || '',
                        filterText: label,
                        category: 'column',
                        table: c.table || tableKey
                    });
                });
            });
            // Statement has FROM/JOIN: never dump the rest of the schema.
            return items;
        }

        function getLocalSqlSuggestions(textBefore, dotCtx, fullText) {
            if (dotCtx) {
                const cols = resolveQualifierColumns(dotCtx.qualifier, fullText || textBefore);
                return filterPrefixMatches(cols, dotCtx.columnPrefix, 80, false);
            }
            const upperText = textBefore.toUpperCase();
            const tableKeywords = ['FROM', 'JOIN', 'INTO', 'UPDATE', 'TABLE'];
            const columnKeywords = ['SELECT', 'WHERE', 'ON', 'ORDER BY', 'GROUP BY', 'HAVING', 'SET'];
            let lastTableKwPos = -1;
            let lastColumnKwPos = -1;
            tableKeywords.forEach(function(kw) {
                const pos = upperText.lastIndexOf(kw);
                if (pos > lastTableKwPos) {
                    lastTableKwPos = pos;
                }
            });
            columnKeywords.forEach(function(kw) {
                const pos = upperText.lastIndexOf(kw);
                if (pos > lastColumnKwPos) {
                    lastColumnKwPos = pos;
                }
            });
            if (lastTableKwPos > lastColumnKwPos) {
                const tables = filterDefaultSchemaTables(sqlSchemaIndex.tableItems);
                if (isPostgresqlSchema()) {
                    return (sqlSchemaIndex.schemaItems || []).concat(tables);
                }
                return tables;
            }
            if (lastColumnKwPos >= 0) {
                const cols = collectScopedColumnItems(fullText || textBefore);
                return cols.concat(keywordCompletions || []);
            }
            const fallback = keywordCompletions.length
                ? keywordCompletions
                : [
                    { label: 'SELECT', kind: 'keyword', insertText: 'SELECT', category: 'keyword' },
                    { label: 'FROM', kind: 'keyword', insertText: 'FROM', category: 'keyword' },
                    { label: 'WHERE', kind: 'keyword', insertText: 'WHERE', category: 'keyword' },
                    { label: 'JOIN', kind: 'keyword', insertText: 'JOIN', category: 'keyword' },
                    { label: 'ON', kind: 'keyword', insertText: 'ON', category: 'keyword' },
                    { label: 'AND', kind: 'keyword', insertText: 'AND', category: 'keyword' },
                    { label: 'ORDER BY', kind: 'keyword', insertText: 'ORDER BY', category: 'keyword' },
                    { label: 'GROUP BY', kind: 'keyword', insertText: 'GROUP BY', category: 'keyword' }
                ];
            return fallback.slice(0, 40);
        }

        function registerCompletions(completions) {
            // completions: [{ label, kind, insertText, detail, category, table }]
            console.log('[MONACO] registerCompletions called with', completions.length, 'items');
            console.log('[MONACO] Current language:', currentLanguage);
            
            allCompletions = completions;
            
            // Separate by category for faster filtering
            tableCompletions = completions.filter(c => c.category === 'table');
            columnCompletions = completions.filter(c => c.category === 'column');
            keywordCompletions = completions.filter(c => c.kind === 'keyword' && c.category !== 'block');
            
            console.log('[MONACO] Filtered:', tableCompletions.length, 'tables,', columnCompletions.length, 'columns,', keywordCompletions.length, 'keywords');
            
            // Build table->columns map
            columnsByTable = {};
            columnCompletions.forEach(c => {
                const tableKey = c.table || c.tableBare || '';
                if (!tableKey) {
                    return;
                }
                const keys = [tableKey];
                const bare = String(c.tableBare || tableKey).split('.').pop();
                if (bare && bare !== tableKey) {
                    keys.push(bare);
                }
                keys.forEach(function(key) {
                    const lk = key.toLowerCase();
                    [key, lk].forEach(function(k) {
                        if (!columnsByTable[k]) {
                            columnsByTable[k] = [];
                        }
                        const dup = columnsByTable[k].some(function(x) {
                            return x.label === c.label;
                        });
                        if (!dup) {
                            columnsByTable[k].push(c);
                        }
                    });
                });
            });
        }
        
        function getCurrentWordPrefix(textBefore) {
            const currentLine = (textBefore.split('\n').pop() || '');
            const match = currentLine.match(/[\w.$@#]*$/);
            return match ? match[0] : '';
        }

        function completionItemMatchesPrefix(item, lower) {
            if (!lower) {
                return true;
            }
            if (item.category === 'block') {
                const name = String(item.blockName || item.filterText || '').toLowerCase();
                const label = String(item.label || '').toLowerCase();
                return name.startsWith(lower) || label.includes(lower);
            }
            const label = String(item.label || '').toLowerCase();
            if (label.startsWith(lower)) {
                return true;
            }
            if (
                isDatabricksSchema()
                && item.category === 'table'
                && label.indexOf('.') >= 0
                && lower.indexOf('.') < 0
            ) {
                return false;
            }
            if (lower.length >= 2 && label.includes(lower)) {
                return true;
            }
            return false;
        }

        function filterPrefixMatches(items, prefix, limit, includeBlocksWithoutPrefix) {
            const maxItems = limit || 80;
            const list = items || [];
            if (!prefix) {
                if (includeBlocksWithoutPrefix) {
                    const blocks = list.filter(i => i.category === 'block');
                    const rest = list.filter(i => i.category !== 'block');
                    return blocks.concat(rest).slice(0, maxItems);
                }
                return list.filter(i => i.category !== 'block').slice(0, maxItems);
            }
            const lower = prefix.toLowerCase().replace(/^@+/, '');
            const starts = [];
            const contains = [];
            list.forEach(function(item) {
                if (!completionItemMatchesPrefix(item, lower)) {
                    return;
                }
                const label = String(item.label || '').toLowerCase();
                if (label.startsWith(lower)) {
                    starts.push(item);
                } else {
                    contains.push(item);
                }
            });
            return starts.concat(contains).slice(0, maxItems);
        }

        function parsePythonDotContext(textBefore) {
            const currentLine = (textBefore.split('\n').pop() || '');
            const match = currentLine.match(/(\w+)\.([\w]*)$/);
            if (!match) {
                return null;
            }
            return { qualifier: match[1], columnPrefix: match[2] || '' };
        }

        function filterCompletionsByContext(textBefore, language) {
            if (language === 'sql') {
                const crossDbCtx = parseSqlCrossDatabaseTableContext(textBefore);
                const dotCtx = parseSqlDotContext(textBefore);
                const fullText = editor ? editor.getValue() : textBefore;
                return filterPrefixMatches(
                    collectSqlLocalItems(textBefore, dotCtx, crossDbCtx, fullText),
                    getSqlCompletionPrefix(textBefore, dotCtx, crossDbCtx)
                );
            } else if (language === 'python') {
                const dotCtx = parsePythonDotContext(textBefore);
                if (dotCtx) {
                    const scoped = (allCompletions || []).filter(function(item) {
                        const ft = String(item.filterText || '');
                        return ft.startsWith(dotCtx.qualifier + '.');
                    });
                    return filterPrefixMatches(scoped, dotCtx.columnPrefix, 80, false);
                }
                return filterPrefixMatches(allCompletions, getCurrentWordPrefix(textBefore));
            }
            return filterPrefixMatches(allCompletions, getCurrentWordPrefix(textBefore));
        }
        
        function filterSqlCompletions(textBefore, dotCtx) {
            const crossDbCtx = parseSqlCrossDatabaseTableContext(textBefore);
            if (crossDbCtx) {
                return collectCrossDatabaseTableItems(crossDbCtx);
            }

            const upperText = textBefore.toUpperCase();
            const lines = textBefore.split('\n');
            const currentLine = lines[lines.length - 1];

            const dotMatch = currentLine.match(/(\w+)\.$/);
            if (dotMatch) {
                const tableName = dotMatch[1];
                const fullText = editor ? editor.getValue() : textBefore;
                const scoped = collectDotColumnItems(tableName, fullText);
                if (scoped.length > 0) {
                    return scoped;
                }
                const columns = columnsByTable[tableName] || columnsByTable[tableName.toLowerCase()];
                if (columns && columns.length > 0) {
                    return columns;
                }
            }

            const hasSchemaIndex = sqlSchemaIndex
                && (sqlSchemaIndex.tableItems || []).length > 0;
            if (hasSchemaIndex) {
                return getLocalSqlSuggestions(textBefore, dotCtx, editor ? editor.getValue() : textBefore);
            }

            // Remove comments and strings for cleaner analysis
            let cleaned = upperText.replace(/--[^\n]*/g, ' ').replace(/'[^']*'/g, "''");

            const tableKeywords = ['FROM', 'JOIN', 'INTO', 'UPDATE', 'TABLE'];
            const columnKeywords = ['SELECT', 'WHERE', 'ON', 'ORDER BY', 'GROUP BY', 'HAVING', 'SET'];

            let lastTableKwPos = -1;
            let lastColumnKwPos = -1;

            tableKeywords.forEach(kw => {
                const pos = cleaned.lastIndexOf(kw);
                if (pos > lastTableKwPos) lastTableKwPos = pos;
            });

            columnKeywords.forEach(kw => {
                const pos = cleaned.lastIndexOf(kw);
                if (pos > lastColumnKwPos) lastColumnKwPos = pos;
            });

            if (lastTableKwPos > lastColumnKwPos && lastTableKwPos > cleaned.length - 100) {
                return filterDefaultSchemaTables(tableCompletions).slice(0, 80);
            }

            if (lastColumnKwPos > lastTableKwPos && lastColumnKwPos > cleaned.length - 100) {
                return [...columnCompletions.slice(0, 80), ...keywordCompletions];
            }

            return [...keywordCompletions, ...tableCompletions.slice(0, 80)];
        }
        
        function getCompletionKind(kind) {
            const kinds = {
                'keyword': monaco.languages.CompletionItemKind.Keyword,
                'function': monaco.languages.CompletionItemKind.Function,
                'variable': monaco.languages.CompletionItemKind.Variable,
                'class': monaco.languages.CompletionItemKind.Class,
                'table': monaco.languages.CompletionItemKind.Class,
                'module': monaco.languages.CompletionItemKind.Module,
                'property': monaco.languages.CompletionItemKind.Property,
                'method': monaco.languages.CompletionItemKind.Method,
                'field': monaco.languages.CompletionItemKind.Field,
                'snippet': monaco.languages.CompletionItemKind.Snippet,
                'text': monaco.languages.CompletionItemKind.Text
            };
            return kinds[kind] || monaco.languages.CompletionItemKind.Text;
        }
        
        // Apply background color to page
        function setBackgroundColor(color) {
            document.documentElement.style.setProperty('--editor-bg', color);
            document.body.style.background = color;
        }
    </script>
</body>
