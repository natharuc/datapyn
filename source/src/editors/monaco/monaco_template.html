<!DOCTYPE html>
<html lang="en" style="background:#121a2b;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataPyn Monaco Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121a2b;
        }
        #editor-container {
            width: 100%;
            height: 100%;
        }
        /* Ghost text styling */
        .ghost-text {
            opacity: 0.4;
            font-style: italic;
        }
        /* Suggest widget (autocomplete dropdown) - show more items */
        .monaco-editor .suggest-widget {
            min-height: 200px !important;
            max-height: 400px !important;
        }
        .monaco-editor .suggest-widget .monaco-list {
            min-height: 180px !important;
        }
        .monaco-editor .suggest-widget .monaco-list .monaco-scrollable-element {
            min-height: 180px !important;
        }
        /* Copilot edit highlight - golden glow on edited lines */
        .copilot-highlight-line {
            background: rgba(180, 142, 173, 0.18) !important;
            border-left: 3px solid #b48ead !important;
            animation: copilotHighlightFade 2s ease-out forwards;
        }
        .copilot-highlight-glyph {
            background: #b48ead;
            width: 3px !important;
        }
        @keyframes copilotHighlightFade {
            0% { background: rgba(180, 142, 173, 0.25); }
            70% { background: rgba(180, 142, 173, 0.15); }
            100% { background: rgba(180, 142, 173, 0.0); }
        }
    </style>
</head>
<body>
    <div id="editor-container">
        <div id="loading-indicator"></div>
    </div>
    
    <!-- Monaco loader from cdnjs (more reliable) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js" 
            onerror="document.getElementById('editor-container').innerHTML='<p style=color:#ff6b6b;padding:20px>Failed to load Monaco from CDN. Check network connection.</p>'"></script>
    
    <!-- Qt WebChannel -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    
    <script>
        // Python bridge reference
        let pyBridge = null;
        let editor = null;
        let inlineCompletionProvider = null;
        
        // Completion tracking
        let pendingCompletionId = 0;
        let pendingCompletion = null;
        let cachedInlineCompletion = null;
        let cachedInlinePosition = null;
        let completionRequestSeq = 0;
        let pendingSqlCompletions = new Map();
        let pendingSqlContextCompletions = new Map();
        let pendingPythonCompletions = new Map();
        let sqlDebounceTimer = null;
        let pythonDebounceTimer = null;
        let sqlDebounceSeq = 0;
        let pythonDebounceSeq = 0;
        const COMPLETION_DEBOUNCE_MS = 120;
        const SQL_CONTEXT_DEBOUNCE_MS = 80;
        // VS Code Copilot: ~300ms pause after last keystroke before ghost text.
        const INLINE_SUGGEST_IDLE_MS = 300;
        const INLINE_PREFIX_MAX = 2000;
        const INLINE_SUFFIX_MAX = 500;
        let inlineGhostTriggerToken = 0;
        const COMPLETION_TIMEOUT_MS = 8000;
        let sqlSchemaIndex = { columnsByKey: {}, tableItems: [], currentDatabase: '' };
        let copilotSuggestText = '';
        const SQL_JOIN_RESERVED = new Set([
            'ON', 'WHERE', 'AND', 'OR', 'JOIN', 'INNER', 'LEFT', 'RIGHT', 'OUTER',
            'CROSS', 'FULL', 'GROUP', 'ORDER', 'BY', 'HAVING', 'SET', 'SELECT', 'FROM'
        ]);
        const TEXT_CHANGE_DEBOUNCE_MS = 80;
        const TEXT_CHANGE_DEBOUNCE_LARGE_MS = 1500;
        const LARGE_DOC_LINE_LIMIT = 2000;
        const LARGE_DOC_CHAR_LIMIT = 150000;

        function isLargeDocument(model) {
            if (!model) {
                return false;
            }
            var lineCount = model.getLineCount();
            var charCount = model.getValueLength ? model.getValueLength() : 0;
            return lineCount >= LARGE_DOC_LINE_LIMIT || charCount >= LARGE_DOC_CHAR_LIMIT;
        }
        
        // Current state
        let currentLanguage = 'python';
        let currentTheme = 'vs-dark';
        
        // Initialize Qt WebChannel when transport is available
        function initWebChannel() {
            if (typeof qt !== 'undefined' && qt.webChannelTransport) {
                new QWebChannel(qt.webChannelTransport, function(channel) {
                    pyBridge = channel.objects.pyBridge;
                    console.log('WebChannel connected to Python bridge');
                    
                    // Initialize Monaco
                    initMonaco();
                });
            } else {
                // Retry after a short delay
                setTimeout(initWebChannel, 50);
            }
        }
        
        // Start initialization
        if (typeof QWebChannel !== 'undefined') {
            initWebChannel();
        } else {
            // Fallback - just init Monaco without bridge
            console.warn('QWebChannel not available, initializing Monaco standalone');
            document.addEventListener('DOMContentLoaded', initMonaco);
        }
        
        function initMonaco() {
            if (typeof require === 'undefined') {
                console.error('Monaco loader not available');
                document.getElementById('editor-container').innerHTML = 
                    '<p style="color:#ff6b6b;padding:20px;">Failed to load Monaco Editor. Check network connection.</p>';
                return;
            }
            
            require.config({
                paths: {
                    'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'
                }
            });
            
            // Configure Monaco Environment for web workers (syntax highlighting)
            window.MonacoEnvironment = {
                getWorkerUrl: function(workerId, label) {
                    return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
                        self.MonacoEnvironment = { baseUrl: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/' };
                        importScripts('https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/base/worker/workerMain.min.js');
                    `)}`;
                }
            };
            
            require(['vs/editor/editor.main'], function() {
                // Clear loading indicator
                var container = document.getElementById('editor-container');
                container.innerHTML = '';
                
                // Create editor instance
                editor = monaco.editor.create(container, {
                    value: '',
                    language: currentLanguage,
                    theme: currentTheme,
                    automaticLayout: false,  // Disabled to avoid ResizeObserver loops - call doLayout() manually
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    fontSize: 13,
                    fontFamily: "'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace",
                    lineNumbers: 'on',
                    renderWhitespace: 'selection',
                    tabSize: 4,
                    insertSpaces: true,
                    wordWrap: 'off',
                    suggest: {
                        showInlineDetails: true,
                        showMethods: true,
                        showFunctions: true,
                        showVariables: true,
                        showClasses: true,
                        showKeywords: true,
                        maxVisibleSuggestions: 18,
                        showStatusBar: true,
                        preview: true,
                        previewMode: 'subwordSmart',
                        snippetsPreventQuickSuggestions: false
                    },
                    suggestFontSize: 13,
                    suggestLineHeight: 22,
                    inlineSuggest: {
                        enabled: true,
                        mode: 'subwordSmart',
                        showToolbar: 'onHover'
                    },
                    quickSuggestions: {
                        other: false,
                        comments: false,
                        strings: false
                    },
                    quickSuggestionsDelay: 80,
                    suggestOnTriggerCharacters: false,
                    wordBasedSuggestions: 'off',
                    parameterHints: { enabled: true },
                });
                
                // Register inline completion provider for ghost text
                registerInlineCompletionProvider();
                
                // Register standard (non-AI) completion providers
                registerStandardCompletionProviders();
                
                // Setup event listeners
                setupEventListeners();

                applyLanguageCompletionUx(currentLanguage);
                
                // Setup debounced resize observer for manual layout
                setupResizeObserver();
                
                // Notify Python that editor is ready
                if (pyBridge) {
                    pyBridge.onEditorReady();
                }
            });
        }
        
        // Debounced resize handling for manual layout
        var resizeTimeout = null;
        function setupResizeObserver() {
            var container = document.getElementById('editor-container');
            if (window.ResizeObserver && container) {
                var observer = new ResizeObserver(function(entries) {
                    // Debounce: wait 100ms after last resize before calling layout
                    if (resizeTimeout) clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(function() {
                        if (editor) editor.layout();
                    }, 100);
                });
                observer.observe(container);
            }
        }
        
        // Manual layout function callable from Python
        function doLayout() {
            if (editor) editor.layout();
        }
        
        let inlineSuggestIdleTimer = null;
        let textChangeDebounceTimer = null;
        let lastTypingAt = 0;

        function getCompletionReplaceRange(model, position) {
            const line = model.getLineContent(position.lineNumber);
            const before = line.substring(0, Math.max(0, position.column - 1));
            const match = before.match(/[\w.$@#[\]`"]*$/i);
            const startColumn = match
                ? Math.max(1, position.column - match[0].length)
                : position.column;
            return new monaco.Range(
                position.lineNumber,
                startColumn,
                position.lineNumber,
                position.column
            );
        }

        const SQL_IDENT_ATOM = '(?:"(?:[^"]|"")*"|[\\w@#\\[\\]]+)';

        function getSqlCompletionReplaceRange(model, position, dotCtx, crossDbCtx) {
            const line = model.getLineContent(position.lineNumber);
            const col = position.column;
            if (crossDbCtx) {
                const prefixLen = (crossDbCtx.tablePrefix || '').length;
                return {
                    startLineNumber: position.lineNumber,
                    endLineNumber: position.lineNumber,
                    startColumn: col - prefixLen,
                    endColumn: col
                };
            }
            if (dotCtx) {
                const prefix = String(dotCtx.columnPrefix || '');
                let startColumn = col - prefix.length;
                if (startColumn > 1 && line.charAt(startColumn - 2) === '"') {
                    startColumn -= 1;
                }
                return {
                    startLineNumber: position.lineNumber,
                    endLineNumber: position.lineNumber,
                    startColumn: Math.max(1, startColumn),
                    endColumn: col
                };
            }
            const before = line.substring(0, Math.max(0, col - 1));
            const match = before.match(/"?[\w$]*$/);
            const startColumn = match
                ? Math.max(1, col - match[0].length)
                : col;
            return {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: startColumn,
                endColumn: col
            };
        }

        /** Ghost text range at cursor only (Monaco 0.45 / VS Code — do not replace the word before cursor). */
        function getInlineGhostRange(model, position) {
            return new monaco.Range(
                position.lineNumber,
                position.column,
                position.lineNumber,
                position.column
            );
        }

        function normalizeInlineInsertAtCursor(text, model, position) {
            if (!text || !model || !position) {
                return text || '';
            }
            const line = model.getLineContent(position.lineNumber);
            const after = line.substring(position.column - 1);
            if (after && text.startsWith(after)) {
                const trimmed = text.substring(after.length);
                return trimmed || text;
            }
            return text;
        }

        /** T-SQL database..tablePrefix at cursor (cross-database table list). */
        function parseSqlCrossDatabaseTableContext(textBefore) {
            const currentLine = (textBefore.split('\n').pop() || '');
            const match = currentLine.match(/(?:^|[\s,(])([\w@#\[\]`"]+)\s*\.\s*\.\s*([\w$]*)$/i);
            if (!match) {
                return null;
            }
            let database = match[1] || '';
            database = database.replace(/[\[\]`"]/g, '');
            return { database: database, tablePrefix: match[2] || '' };
        }

        /** alias.columnPrefix at cursor — matches Python SqlAutoCompleteService dot detection. */
        function parseSqlDotContext(textBefore) {
            if (parseSqlCrossDatabaseTableContext(textBefore)) {
                return null;
            }
            const currentLine = (textBefore.split('\n').pop() || '');
            const re = new RegExp(
                '(' + SQL_IDENT_ATOM + '(?:\\s*\\.\\s*' + SQL_IDENT_ATOM + ')*)'
                    + '\\s*\\.\\s*("(?:[^"]|"")*|[\\w$]*)$'
            );
            const match = currentLine.match(re);
            if (!match) {
                return null;
            }
            return {
                qualifier: (match[1] || '').replace(/[\[\]`"]/g, '').replace(/\s+/g, ''),
                columnPrefix: (match[2] || '').replace(/^"+|"+$/g, '')
            };
        }

        function getSqlCompletionPrefix(textBefore, dotCtx, crossDbCtx) {
            if (crossDbCtx) {
                return crossDbCtx.tablePrefix || '';
            }
            if (dotCtx) {
                return dotCtx.columnPrefix || '';
            }
            const currentLine = (textBefore.split('\n').pop() || '');
            if (parseSqlCrossDatabaseTableContext(textBefore)) {
                return '';
            }
            return getCurrentWordPrefix(textBefore);
        }

        function collectCrossDatabaseTableItems(crossDbCtx) {
            const dbLower = normalizeSchemaKey(crossDbCtx.database);
            const prefix = (crossDbCtx.tablePrefix || '').toLowerCase();
            const currentDb = normalizeSchemaKey(sqlSchemaIndex.currentDatabase || '');
            const fromIndex = (sqlSchemaIndex.tableItems || []).filter(function(item) {
                const itemDb = normalizeSchemaKey(item.database || item.catalog || '');
                if (itemDb) {
                    if (itemDb !== dbLower) {
                        return false;
                    }
                } else if (currentDb && currentDb !== dbLower) {
                    return false;
                }
                if (!prefix) {
                    return true;
                }
                const label = String(item.label || '').toLowerCase();
                const filterText = String(item.filterText || label).toLowerCase();
                return label.startsWith(prefix) || filterText.endsWith('..' + prefix) || filterText.includes('..' + prefix);
            });
            if (fromIndex.length) {
                return fromIndex;
            }
            return tableCompletions.filter(function(item) {
                const itemDb = normalizeSchemaKey(item.database || '');
                if (itemDb && itemDb !== dbLower) {
                    return false;
                }
                if (!prefix) {
                    return true;
                }
                const label = String(item.label || '').toLowerCase();
                return label.startsWith(prefix);
            });
        }

        function filterRemoteCompletionItems(items, textBefore, dotCtx) {
            const prefix = dotCtx ? dotCtx.columnPrefix : getCurrentWordPrefix(textBefore);
            let filtered = filterPrefixMatches(items || [], prefix, 80, false);
            if (!dotCtx) {
                filtered = filterSqlServerDefaultSchema(filtered, textBefore);
            }
            return filtered;
        }

        function normalizeInlineInsertText(text, model, position) {
            if (!text || !model || !position) {
                return text || '';
            }
            const replaceRange = getCompletionReplaceRange(model, position);
            const line = model.getLineContent(position.lineNumber);
            const existing = line.substring(
                replaceRange.startColumn - 1,
                replaceRange.endColumn - 1
            );
            if (existing && text.startsWith(existing)) {
                const trimmed = text.substring(existing.length);
                return trimmed || text;
            }
            return text;
        }

        function positionsClose(a, b) {
            if (!a || !b) {
                return false;
            }
            return a.lineNumber === b.lineNumber && Math.abs(a.column - b.column) <= 48;
        }

        function extractSqlAliases(fullText) {
            const aliases = {};
            if (!fullText) {
                return aliases;
            }
            const re = new RegExp(
                '\\b(?:FROM|JOIN|UPDATE|INTO)\\s+('
                    + SQL_IDENT_ATOM
                    + '(?:\\s*\\.\\s*'
                    + SQL_IDENT_ATOM
                    + ')*)(?:\\s+(?:AS\\s+)?([A-Za-z_]\\w*))?',
                'gi'
            );
            let match;
            while ((match = re.exec(fullText)) !== null) {
                let tableRef = match[1] || '';
                tableRef = tableRef.replace(/[\[\]`"]/g, '').replace(/\s+/g, '');
                const bare = tableRef.split('.').pop() || tableRef;
                const alias = match[2] || '';
                const bareKey = normalizeSchemaKey(bare);
                if (bareKey) {
                    aliases[bareKey] = bareKey;
                }
                if (alias && !SQL_JOIN_RESERVED.has(alias.toUpperCase())) {
                    aliases[normalizeSchemaKey(alias)] = bareKey;
                }
            }
            return aliases;
        }

        function lookupColumnsForTable(tableKey) {
            const key = normalizeSchemaKey(tableKey);
            if (!key) {
                return [];
            }
            const direct = sqlSchemaIndex.columnsByKey[key];
            if (direct && direct.length) {
                return direct;
            }
            const dboKey = 'dbo.' + key;
            const dboCols = sqlSchemaIndex.columnsByKey[dboKey];
            if (dboCols && dboCols.length) {
                return dboCols;
            }
            // Short aliases (c, p, t) must not suffix-match unrelated keys like "foo.c".
            if (key.length < 3) {
                return [];
            }
            const suffix = '.' + key;
            let best = [];
            Object.keys(sqlSchemaIndex.columnsByKey || {}).forEach(function(k) {
                const cols = sqlSchemaIndex.columnsByKey[k] || [];
                if (!cols.length) {
                    return;
                }
                if (k === key || k.endsWith(suffix)) {
                    if (k === dboKey || k.indexOf('.dbo.' + key) >= 0) {
                        best = cols;
                    } else if (!best.length) {
                        best = cols;
                    }
                }
            });
            return best;
        }

        function resolveQualifierColumns(qualifier, fullText) {
            const key = normalizeSchemaKey(qualifier);
            const aliasMap = extractSqlAliases(fullText || '');
            const tableKey = aliasMap[key] || key;
            return lookupColumnsForTable(tableKey);
        }

        function mergeCompletionItems(primary, secondary) {
            const seen = new Set();
            const merged = [];
            (primary || []).concat(secondary || []).forEach(function(item) {
                const key = (item.label || '') + '|' + (item.insertText || item.label || '');
                if (!key || seen.has(key)) {
                    return;
                }
                seen.add(key);
                merged.push(item);
            });
            return merged;
        }

        /** Columns for alias/table. only — never mix other FROM/JOIN tables. */
        function collectDotColumnItems(qualifier, fullText) {
            return resolveQualifierColumns(qualifier || '', fullText);
        }

        function isKnownSchemaName(name) {
            const key = normalizeSchemaKey(name);
            return key && sqlSchemaIndex.schemaNames && sqlSchemaIndex.schemaNames.has(key);
        }

        function collectSchemaTableItems(schemaName, tablePrefix) {
            const schemaKey = normalizeSchemaKey(schemaName);
            const prefix = (tablePrefix || '').toLowerCase();
            return (sqlSchemaIndex.tableItems || []).filter(function(item) {
                if (normalizeSchemaKey(item.schemaName || '') !== schemaKey) {
                    return false;
                }
                if (!prefix) {
                    return true;
                }
                return String(item.label || '').toLowerCase().startsWith(prefix);
            });
        }

        function isSqlServerSchema() {
            const t = String(sqlSchemaDbType || '').toLowerCase();
            return t === 'sqlserver' || t === 'mssql';
        }

        function isDatabricksSchema() {
            return String(sqlSchemaDbType || '').toLowerCase() === 'databricks';
        }

        function isPostgresqlSchema() {
            const t = String(sqlSchemaDbType || '').toLowerCase();
            return t === 'postgres' || t === 'postgresql';
        }

        function quotePostgresIdentifier(name) {
            const raw = String(name || '');
            if (!raw) {
                return raw;
            }
            return raw.split('.').map(function(part) {
                if (!part) {
                    return part;
                }
                let inner = part;
                if (inner.charAt(0) === '"' && inner.charAt(inner.length - 1) === '"' && inner.length >= 2) {
                    inner = inner.slice(1, -1).replace(/""/g, '"');
                }
                return '"' + inner.replace(/"/g, '""') + '"';
            }).join('.');
        }

        function quoteSqlIdentifierIfNeeded(name) {
            if (!isPostgresqlSchema()) {
                return name;
            }
            return quotePostgresIdentifier(name);
        }

        function databricksCurrentCatalog() {
            return String(sqlSchemaIndex.currentDatabase || '');
        }

        function databricksCurrentSchema() {
            return String(sqlSchemaIndex.currentSchema || '');
        }

        function databricksTableLabel(catalog, schemaName, tableName) {
            const curCat = databricksCurrentCatalog().toLowerCase();
            const curSch = databricksCurrentSchema().toLowerCase();
            const cat = String(catalog || '');
            const sch = String(schemaName || '');
            if (cat && sch && cat.toLowerCase() === curCat && sch.toLowerCase() === curSch) {
                return tableName;
            }
            return [cat, sch, tableName].filter(function(part) { return part; }).join('.');
        }

        function lookupCatalogSchemas(catalog) {
            const map = sqlSchemaIndex.catalogSchemas || {};
            const key = normalizeSchemaKey(catalog);
            if (map[catalog]) {
                return map[catalog] || [];
            }
            const names = Object.keys(map);
            for (let i = 0; i < names.length; i++) {
                if (normalizeSchemaKey(names[i]) === key) {
                    return map[names[i]] || [];
                }
            }
            return [];
        }

        function isKnownCatalogName(name) {
            const key = normalizeSchemaKey(name);
            if (!key) {
                return false;
            }
            const catalogs = sqlSchemaIndex.catalogs || [];
            for (let i = 0; i < catalogs.length; i++) {
                if (normalizeSchemaKey(catalogs[i]) === key) {
                    return true;
                }
            }
            const map = sqlSchemaIndex.catalogSchemas || {};
            return Object.keys(map).some(function(catalog) {
                return normalizeSchemaKey(catalog) === key;
            });
        }

        function collectDatabricksNamespaceItems(prefix) {
            const parts = String(prefix || '').split('.').filter(function(part) { return part; });
            if (!parts.length) {
                return [];
            }
            if (parts.length === 1) {
                const catalog = parts[0];
                const schemas = lookupCatalogSchemas(catalog).slice();
                const seen = new Set();
                (sqlSchemaIndex.tableItems || []).forEach(function(item) {
                    if (normalizeSchemaKey(item.catalog || '') === normalizeSchemaKey(catalog) && item.schemaName) {
                        schemas.push(item.schemaName);
                    }
                });
                return schemas.filter(function(schemaName) {
                    const key = normalizeSchemaKey(schemaName);
                    if (!key || seen.has(key)) {
                        return false;
                    }
                    seen.add(key);
                    return true;
                }).map(function(schemaName) {
                    return {
                        label: schemaName,
                        kind: 'module',
                        insertText: quoteSqlIdentifierIfNeeded(schemaName),
                        detail: catalog + '.' + schemaName,
                        category: 'schema'
                    };
                });
            }
            if (parts.length === 2) {
                const catalog = parts[0];
                const schemaName = parts[1];
                return (sqlSchemaIndex.tableItems || []).filter(function(item) {
                    return normalizeSchemaKey(item.catalog || '') === normalizeSchemaKey(catalog)
                        && normalizeSchemaKey(item.schemaName || '') === normalizeSchemaKey(schemaName);
                }).map(function(item) {
                    return {
                        label: item.label,
                        kind: item.kind || 'class',
                        insertText: item.insertText || item.label,
                        detail: item.detail,
                        category: 'table'
                    };
                });
            }
            return [];
        }

        function inferSqlServerTableSchemaName(table, name, tableKey, fallbackKey) {
            const explicit = typeof table === 'object' ? String(table.schema || '').trim() : '';
            if (explicit) {
                return explicit;
            }
            const key = String(tableKey || fallbackKey || '').trim();
            const parts = key.split('.').filter(function(part) { return part; });
            const dbType = String(sqlSchemaDbType || '').toLowerCase();
            const isSs = dbType === 'sqlserver' || dbType === 'mssql';
            if (parts.length >= 3) {
                return parts[parts.length - 2];
            }
            if (parts.length === 2) {
                return parts[0];
            }
            if (isSs) {
                return 'dbo';
            }
            return '';
        }

        function filterDatabricksCurrentContextTables(items) {
            if (!isDatabricksSchema()) {
                return items || [];
            }
            const curCat = databricksCurrentCatalog().toLowerCase();
            const curSch = databricksCurrentSchema().toLowerCase();
            if (!curCat || !curSch) {
                return items || [];
            }
            return (items || []).filter(function(item) {
                const cat = String(item.catalog || '').toLowerCase();
                const sch = String(item.schemaName || '').toLowerCase();
                return cat === curCat && sch === curSch;
            });
        }

        function filterDefaultSchemaTables(items) {
            if (isDatabricksSchema()) {
                return filterDatabricksCurrentContextTables(items);
            }
            if (!isSqlServerSchema()) {
                return items || [];
            }
            return (items || []).filter(function(item) {
                const schema = normalizeSchemaKey(item.schemaName || '');
                if (!schema) {
                    return true;
                }
                return schema === 'dbo';
            });
        }

        function shouldUseDatabricksCurrentContextOnly(textBefore) {
            if (!isDatabricksSchema()) {
                return false;
            }
            if (parseSqlDotContext(textBefore)) {
                return false;
            }
            const currentLine = (textBefore.split('\n').pop() || '').replace(/\s+$/, '');
            if (/(?:^|[\s,(])[\w@#]+\.[\w$]*$/.test(currentLine)) {
                return false;
            }
            return true;
        }

        function shouldUseSqlServerDefaultSchemaOnly(textBefore) {
            if (!isSqlServerSchema()) {
                return false;
            }
            if (parseSqlCrossDatabaseTableContext(textBefore)) {
                return false;
            }
            const dotCtx = parseSqlDotContext(textBefore);
            if (dotCtx && isKnownSchemaName(dotCtx.qualifier)) {
                return false;
            }
            const currentLine = (textBefore.split('\n').pop() || '').replace(/\s+$/, '');
            const explicitSchema = currentLine.match(/(?:^|[\s,(])([\w@#]+)\.\s*[\w$]*$/);
            if (explicitSchema && isKnownSchemaName(explicitSchema[1])) {
                return false;
            }
            return true;
        }

        function filterSqlServerDefaultSchema(items, textBefore) {
            if (shouldUseDatabricksCurrentContextOnly(textBefore)) {
                return filterDatabricksCurrentContextTables(items || []);
            }
            if (!shouldUseSqlServerDefaultSchemaOnly(textBefore)) {
                return items || [];
            }
            return filterDefaultSchemaTables(items || []);
        }

        function collectSqlLocalItems(textBefore, dotCtx, crossDbCtx, fullText) {
            if (crossDbCtx) {
                return collectCrossDatabaseTableItems(crossDbCtx);
            }
            if (dotCtx && isDatabricksSchema()) {
                const qualifier = String(dotCtx.qualifier || '');
                const parts = qualifier.split('.').filter(function(part) { return part; });
                if (parts.length === 1 && isKnownCatalogName(parts[0])) {
                    return filterPrefixMatches(
                        collectDatabricksNamespaceItems(qualifier),
                        dotCtx.columnPrefix,
                        80,
                        false
                    );
                }
                if (parts.length >= 2) {
                    return filterPrefixMatches(
                        collectDatabricksNamespaceItems(qualifier),
                        dotCtx.columnPrefix,
                        80,
                        false
                    );
                }
                const nsItems = collectDatabricksNamespaceItems(qualifier);
                if (nsItems.length) {
                    return filterPrefixMatches(nsItems, dotCtx.columnPrefix, 80, false);
                }
            }
            if (dotCtx && isKnownSchemaName(dotCtx.qualifier)) {
                return collectSchemaTableItems(dotCtx.qualifier, dotCtx.columnPrefix);
            }
            if (dotCtx) {
                // alias.column — only that table's columns (never merge other JOIN sources)
                return collectDotColumnItems(dotCtx.qualifier, fullText);
            }
            let contextual = filterSqlCompletions(textBefore, null);
            contextual = filterSqlServerDefaultSchema(contextual, textBefore);
            return contextual;
        }

        function buildCopilotSuggestItems(range) {
            if (!copilotSuggestText) {
                return [];
            }
            const preview = copilotSuggestText.split('\n')[0].substring(0, 100);
            return [{
                label: 'Copilot: ' + preview,
                kind: monaco.languages.CompletionItemKind.Snippet,
                insertText: copilotSuggestText,
                detail: 'Sugestão IA (Tab)',
                range: range,
                sortText: '!000',
                filterText: preview,
                category: 'copilot'
            }];
        }

        function editorTypingIdleMs() {
            return Date.now() - lastTypingAt;
        }

        function isTypingIdleForInlineAi() {
            return editorTypingIdleMs() >= INLINE_SUGGEST_IDLE_MS - 40;
        }

        function applyLanguageCompletionUx(language) {
            if (!editor) {
                return;
            }
            if (language === 'python') {
                // IA first: ghost on pause; offline list only via Ctrl+Space.
                editor.updateOptions({
                    quickSuggestions: { other: false, comments: false, strings: false },
                    suggestOnTriggerCharacters: false,
                    inlineSuggest: { enabled: true, mode: 'subwordSmart', showToolbar: 'onHover' }
                });
            } else if (language === 'sql') {
                // Offline columns/tables while typing; IA ghost after idle pause.
                editor.updateOptions({
                    quickSuggestions: { other: true, comments: false, strings: true },
                    suggestOnTriggerCharacters: true,
                    inlineSuggest: { enabled: true, mode: 'subwordSmart', showToolbar: 'onHover' }
                });
            }
        }

        function presentInlineGhost(text, line, column) {
            if (!editor || !text) {
                return;
            }
            const model = editor.getModel();
            const cursor = editor.getPosition();
            let useLine = line || 1;
            let useColumn = column || 1;
            if (cursor) {
                if (!line || !column) {
                    useLine = cursor.lineNumber;
                    useColumn = cursor.column;
                } else if (positionsClose({ lineNumber: line, column: column }, cursor)) {
                    useLine = cursor.lineNumber;
                    useColumn = cursor.column;
                }
            }
            const insertPos = { lineNumber: useLine, column: useColumn };
            const ghostText = model
                ? (normalizeInlineInsertAtCursor(text, model, insertPos) || text)
                : text;
            if (!ghostText) {
                return;
            }
            copilotSuggestText = ghostText;
            cachedInlineCompletion = ghostText;
            cachedInlinePosition = insertPos;

            dismissSuggestWidgetIfOpen();

            inlineGhostTriggerToken += 1;
            const token = inlineGhostTriggerToken;
            function fireInlineTrigger() {
                if (token !== inlineGhostTriggerToken) {
                    return;
                }
                safeEditorAction('editor.action.inlineSuggest.trigger');
            }
            fireInlineTrigger();
            setTimeout(fireInlineTrigger, 48);
            setTimeout(fireInlineTrigger, 120);
        }

        function trimInlineCompletionPayload(prefix, suffix) {
            return {
                prefix: prefix.length > INLINE_PREFIX_MAX
                    ? prefix.slice(-INLINE_PREFIX_MAX)
                    : prefix,
                suffix: suffix.length > INLINE_SUFFIX_MAX
                    ? suffix.slice(0, INLINE_SUFFIX_MAX)
                    : suffix,
            };
        }

        function clearInlineCompletionCache() {
            const hadPending = !!(pendingCompletion || cachedInlineCompletion);
            inlineGhostTriggerToken += 1;
            cachedInlineCompletion = null;
            cachedInlinePosition = null;
            if (pendingCompletion) {
                pendingCompletion.resolve('');
                pendingCompletion = null;
            }
            if (hadPending && pyBridge && pyBridge.cancelInlineCompletion) {
                pyBridge.cancelInlineCompletion();
            }
        }

        function scheduleIdleInlineSuggest() {
            if (inlineSuggestIdleTimer) {
                clearTimeout(inlineSuggestIdleTimer);
            }
            inlineSuggestIdleTimer = setTimeout(function() {
                inlineSuggestIdleTimer = null;
                if (!editor || !pyBridge) {
                    return;
                }
                if (!editor.hasTextFocus()) {
                    return;
                }
                if (!isTypingIdleForInlineAi()) {
                    return;
                }
                const pos = editor.getPosition();
                const model = editor.getModel();
                if (!pos || !model) {
                    return;
                }
                const line = model.getLineContent(pos.lineNumber);
                const before = line.substring(0, pos.column - 1);
                const linePrefix = before.trim();
                if (linePrefix.length < 3 && !/[.([=]$/.test(linePrefix)) {
                    return;
                }

                const textBeforeCursor = model.getValueInRange({
                    startLineNumber: 1,
                    startColumn: 1,
                    endLineNumber: pos.lineNumber,
                    endColumn: pos.column
                });
                const textAfterCursor = model.getValueInRange({
                    startLineNumber: pos.lineNumber,
                    startColumn: pos.column,
                    endLineNumber: model.getLineCount(),
                    endColumn: model.getLineMaxColumn(model.getLineCount())
                });
                const payload = trimInlineCompletionPayload(textBeforeCursor, textAfterCursor);

                // Request IA directly after idle. Relying only on inlineSuggest.trigger
                // fails when the SQL suggest widget is still open (Monaco 0.45).
                requestCompletion(
                    payload.prefix,
                    payload.suffix,
                    pos.lineNumber,
                    pos.column
                ).then(function(text) {
                    if (!text || !editor) {
                        return;
                    }
                    presentInlineGhost(text, pos.lineNumber, pos.column);
                }).catch(function() {});
            }, INLINE_SUGGEST_IDLE_MS);
        }

        function setupEventListeners() {
            // Text change listener
            editor.onDidChangeModelContent(function(e) {
                lastTypingAt = Date.now();
                copilotSuggestText = '';
                clearInlineCompletionCache();
                if (textChangeDebounceTimer) {
                    clearTimeout(textChangeDebounceTimer);
                }
                var model = editor.getModel();
                var large = isLargeDocument(model);
                var debounceMs = large ? TEXT_CHANGE_DEBOUNCE_LARGE_MS : TEXT_CHANGE_DEBOUNCE_MS;
                textChangeDebounceTimer = setTimeout(function() {
                    textChangeDebounceTimer = null;
                    if (pyBridge) {
                        pyBridge.onTextChanged(editor.getValue());
                    }
                }, debounceMs);
                // Skip AI idle suggest on huge buffers — it pulls full prefix/suffix over the bridge.
                if (!large) {
                    scheduleIdleInlineSuggest();
                }
            });
            
            // Focus listeners
            editor.onDidFocusEditorWidget(function() {
                if (pyBridge) {
                    pyBridge.onFocusIn();
                    // Also emit cursor position on focus (for switching blocks)
                    var pos = editor.getPosition();
                    if (pos) {
                        pyBridge.onCursorChanged(pos.lineNumber, pos.column);
                    }
                }
            });
            
            editor.onDidBlurEditorWidget(function() {
                // Flush pending text sync on blur so save/execute see the latest buffer.
                if (textChangeDebounceTimer) {
                    clearTimeout(textChangeDebounceTimer);
                    textChangeDebounceTimer = null;
                    if (pyBridge) {
                        pyBridge.onTextChanged(editor.getValue());
                    }
                }
                if (pyBridge) {
                    pyBridge.onFocusOut();
                }
            });
            
            // Cursor position change
            editor.onDidChangeCursorPosition(function(e) {
                if (pyBridge) {
                    pyBridge.onCursorChanged(e.position.lineNumber, e.position.column);
                }
            });

            editor.onDidChangeCursorSelection(function(e) {
                if (!pyBridge || !pyBridge.onSelectionChanged) {
                    return;
                }
                const selection = editor.getSelection();
                if (!selection || selection.isEmpty()) {
                    pyBridge.onSelectionChanged("", false);
                    return;
                }
                pyBridge.onSelectionChanged(
                    editor.getModel().getValueInRange(selection),
                    true
                );
            });
            
            // Key bindings for execution (F5, Ctrl+Enter, Shift+Enter)
            editor.addAction({
                id: 'execute-code',
                label: 'Execute Code',
                keybindings: [
                    monaco.KeyCode.F5,
                    monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter,
                    monaco.KeyMod.Shift | monaco.KeyCode.Enter
                ],
                run: function() {
                    triggerExecute();
                }
            });
            
            // Toggle comment (Ctrl+/)
            editor.addAction({
                id: 'toggle-comment',
                label: 'Toggle Comment',
                keybindings: [
                    monaco.KeyMod.CtrlCmd | monaco.KeyCode.Slash
                ],
                run: function() {
                    editor.getAction('editor.action.commentLine').run();
                }
            });

            // IntelliSense dropdown (methods, tables, columns)
            editor.addAction({
                id: 'trigger-suggest',
                label: 'Trigger Suggest',
                keybindings: [
                    monaco.KeyMod.CtrlCmd | monaco.KeyCode.Space
                ],
                run: function() {
                    safeEditorAction('editor.action.triggerSuggest');
                }
            });
        }
        
        function registerInlineCompletionProvider() {
            // Custom inline completion provider for Copilot ghost text
            inlineCompletionProvider = monaco.languages.registerInlineCompletionsProvider(
                ['python', 'sql'],
                {
                    provideInlineCompletions: async function(model, position, context, token) {
                        if (token.isCancellationRequested) {
                            return { items: [] };
                        }

                        if (cachedInlineCompletion && cachedInlinePosition
                            && positionsClose(cachedInlinePosition, position)) {
                            return {
                                items: [{
                                    insertText: cachedInlineCompletion,
                                    range: getInlineGhostRange(model, position)
                                }]
                            };
                        }

                        const invokeKind = monaco.languages.InlineCompletionTriggerKind;
                        const explicitInvoke = invokeKind
                            && context
                            && context.triggerKind === invokeKind.Invoke;
                        if (!explicitInvoke) {
                            return { items: [] };
                        }

                        // Never await AI here — ghost text is delivered via receiveCompletion.
                        const textBeforeCursor = model.getValueInRange({
                            startLineNumber: 1,
                            startColumn: 1,
                            endLineNumber: position.lineNumber,
                            endColumn: position.column
                        });

                        const textAfterCursor = model.getValueInRange({
                            startLineNumber: position.lineNumber,
                            startColumn: position.column,
                            endLineNumber: model.getLineCount(),
                            endColumn: model.getLineMaxColumn(model.getLineCount())
                        });
                        const trimmed = trimInlineCompletionPayload(textBeforeCursor, textAfterCursor);

                        if (!pyBridge) {
                            return { items: [] };
                        }

                        requestCompletion(
                            trimmed.prefix,
                            trimmed.suffix,
                            position.lineNumber,
                            position.column
                        ).catch(function() {});
                        return { items: [] };
                    },
                    
                    freeInlineCompletions: function(completions) {
                        // Cleanup if needed
                    }
                }
            );
        }
        
        function deliverInlineCompletion(text, line, column) {
            if (!text) {
                if (pendingCompletion) {
                    pendingCompletion.resolve('');
                    pendingCompletion = null;
                }
                return;
            }
            if (pendingCompletion) {
                pendingCompletion.resolve(text);
                pendingCompletion = null;
            }
        }

        function absorbTriggerPromise(result) {
            if (result != null && typeof result.then === 'function') {
                void result.then(function() {}, function() {
                    // Monaco 0.45: missing commands reject the trigger promise
                });
            }
        }

        function safeEditorAction(actionId) {
            if (!editor) {
                return;
            }
            const action = editor.getAction(actionId);
            if (action && typeof action.run === 'function') {
                try {
                    absorbTriggerPromise(action.run());
                } catch (e) {
                    console.log('[Monaco] action failed:', actionId, e);
                }
                return;
            }
            try {
                absorbTriggerPromise(editor.trigger('datapyn', actionId, {}));
            } catch (e) {
                console.log('[Monaco] action failed:', actionId, e);
            }
        }

        function dismissSuggestWidgetIfOpen() {
            if (!editor) {
                return;
            }
            const ids = ['hideSuggestWidget', 'cancelSuggestWidget', 'editor.action.hideSuggestWidget'];
            for (let i = 0; i < ids.length; i++) {
                const action = editor.getAction(ids[i]);
                if (!action || typeof action.run !== 'function') {
                    continue;
                }
                if (typeof action.isSupported === 'function' && !action.isSupported()) {
                    continue;
                }
                try {
                    absorbTriggerPromise(action.run());
                } catch (e) {
                    continue;
                }
                return;
            }
        }

        function showInlineCompletionNow() {
            if (cachedInlineCompletion && cachedInlinePosition) {
                presentInlineGhost(
                    cachedInlineCompletion,
                    cachedInlinePosition.lineNumber,
                    cachedInlinePosition.column
                );
            }
        }

        function requestCompletion(prefix, suffix, line, column) {
            return new Promise((resolve, reject) => {
                if (!pyBridge) {
                    console.log('[Monaco] No Python bridge');
                    reject('No Python bridge');
                    return;
                }

                if (pendingCompletion) {
                    pendingCompletion.resolve('');
                    pendingCompletion = null;
                }

                pendingCompletionId++;
                const requestId = pendingCompletionId;

                console.log('[Monaco] Request completion #' + requestId + ' at L' + line + ':C' + column);

                pendingCompletion = { resolve, reject, id: requestId };

                pyBridge.requestCompletion(prefix, suffix, line, column);
                
                // Safety timeout: kept above the Python worker timeout (~6s)
                // so a slow-but-valid AI completion still resolves the promise
                // instead of being dropped by a too-eager JS timeout.
                setTimeout(() => {
                    if (pendingCompletion && pendingCompletion.id === requestId) {
                        console.log('[Monaco] Timeout for completion #' + requestId);
                        pendingCompletion.resolve('');
                        pendingCompletion = null;
                    }
                }, 9000);
            });
        }
        
        function receiveCompletion(text, line, column) {
            console.log('[Monaco] Received completion: ' + (text ? text.substring(0, 50) + '...' : 'empty'));
            let useLine = line || 0;
            let useColumn = column || 0;
            const cursorPos = editor ? editor.getPosition() : null;
            if (cursorPos) {
                if (!useLine || !useColumn) {
                    useLine = cursorPos.lineNumber;
                    useColumn = cursorPos.column;
                } else if (
                    Math.abs(cursorPos.lineNumber - useLine) <= 1
                    && Math.abs(cursorPos.column - useColumn) <= 32
                ) {
                    useLine = cursorPos.lineNumber;
                    useColumn = cursorPos.column;
                }
            } else if (!useLine || !useColumn) {
                useLine = 1;
                useColumn = 1;
            }
            if (pendingCompletion) {
                console.log('[Monaco] Resolving completion #' + pendingCompletion.id);
            }
            const model = editor ? editor.getModel() : null;
            const insertPos = { lineNumber: useLine, column: useColumn };
            let ghostText = text;
            if (model) {
                ghostText = normalizeInlineInsertAtCursor(text, model, insertPos) || text;
            }
            deliverInlineCompletion(ghostText, useLine, useColumn);
            if (ghostText && editor) {
                presentInlineGhost(ghostText, useLine, useColumn);
            }
        }
        
        function createCompletionRequest(kind, invokeBridge) {
            return new Promise((resolve) => {
                if (!pyBridge) {
                    resolve([]);
                    return;
                }

                const requestId = ++completionRequestSeq;
                const pendingMap = kind === 'sql'
                    ? pendingSqlCompletions
                    : kind === 'sql_context'
                        ? pendingSqlContextCompletions
                        : pendingPythonCompletions;

                pendingMap.set(requestId, { resolve });
                invokeBridge(requestId);

                setTimeout(() => {
                    const pending = pendingMap.get(requestId);
                    if (pending) {
                        pending.resolve([]);
                        pendingMap.delete(requestId);
                    }
                }, COMPLETION_TIMEOUT_MS);
            });
        }

        function resolveCompletionRequest(kind, requestId, completions) {
            const pendingMap = kind === 'sql'
                ? pendingSqlCompletions
                : kind === 'sql_context'
                    ? pendingSqlContextCompletions
                    : pendingPythonCompletions;
            const pending = pendingMap.get(requestId);
            if (!pending) {
                return;
            }
            pending.resolve(completions || []);
            pendingMap.delete(requestId);
        }

        function debouncedRemote(kind, invokeBridge, token, debounceMs) {
            return new Promise((resolve) => {
                const delay = debounceMs != null ? debounceMs : COMPLETION_DEBOUNCE_MS;
                const isSql = (kind === 'sql' || kind === 'sql_context');
                if (isSql) {
                    sqlDebounceSeq += 1;
                } else {
                    pythonDebounceSeq += 1;
                }
                const seq = isSql ? sqlDebounceSeq : pythonDebounceSeq;

                if (isSql && sqlDebounceTimer) {
                    clearTimeout(sqlDebounceTimer);
                }
                if (kind === 'python' && pythonDebounceTimer) {
                    clearTimeout(pythonDebounceTimer);
                }

                if (token && token.isCancellationRequested) {
                    resolve([]);
                    return;
                }

                const timer = setTimeout(async () => {
                    const activeSeq = isSql ? sqlDebounceSeq : pythonDebounceSeq;
                    if (token && token.isCancellationRequested) {
                        resolve([]);
                        return;
                    }
                    if (seq !== activeSeq) {
                        resolve([]);
                        return;
                    }
                    resolve(await createCompletionRequest(kind, invokeBridge));
                }, delay);

                if (isSql) {
                    sqlDebounceTimer = timer;
                } else {
                    pythonDebounceTimer = timer;
                }
            });
        }

        function getSortText(c, prefix) {
            const label = String(c.label || '').toLowerCase();
            const lower = String(prefix || '').toLowerCase().replace(/^@+/, '');
            const matchRank = (!lower || label.startsWith(lower)) ? '0' : '1';
            if (c.category === 'block') return matchRank + '00' + (c.blockName || c.label);
            if (c.category === 'variable') return matchRank + '0' + c.label;
            if (c.category === 'column') return matchRank + '0' + c.label;
            if (c.category === 'routine') return matchRank + '1' + c.label;
            if (c.category === 'table') return matchRank + '2' + c.label;
            return matchRank + '3' + c.label;
        }

        function toMonacoSuggestions(items, range, prefix) {
            return (items || []).map(c => {
                const insertText = c.insertText != null ? c.insertText : c.label;
                const suggestion = {
                    label: c.label,
                    kind: getCompletionKind(c.kind),
                    insertText: insertText,
                    detail: c.detail || '',
                    range: range,
                    sortText: getSortText(c, prefix)
                };
                if (c.filterText) {
                    suggestion.filterText = c.filterText;
                }
                // Multiline block snippets: keep full insert, filter by block name / first line
                if (c.category === 'block') {
                    suggestion.filterText = c.filterText || c.blockName || c.label;
                    if (typeof insertText === 'string' && insertText.indexOf('\n') >= 0) {
                        suggestion.insertTextRules =
                            monaco.languages.CompletionItemInsertTextRule.None;
                    }
                }
                return suggestion;
            });
        }

        function mergeSuggestions(primary, secondary) {
            const seen = new Set();
            const merged = [];
            (primary || []).concat(secondary || []).forEach(item => {
                const key = (item.label || '') + '|' + (item.insertText || item.label || '');
                if (!key || seen.has(key)) {
                    return;
                }
                seen.add(key);
                merged.push(item);
            });
            return merged;
        }

        // Request SQL context completions from Python (aliases, CTEs, subqueries)
        function requestSqlContextCompletions(fullText, prefix, line, column) {
            return createCompletionRequest('sql_context', (requestId) => {
                pyBridge.requestSqlContext(fullText, prefix, line, column, requestId);
            });
        }
        
        function receiveSqlContextCompletions(requestId, completions) {
            console.log('[Monaco] receiveSqlContextCompletions #' + requestId + ' items=' + (completions ? completions.length : 0));
            resolveCompletionRequest('sql_context', requestId, completions);
        }
        
        function requestSqlCompletions(fullText, line, column) {
            return createCompletionRequest('sql', (requestId) => {
                pyBridge.requestSqlCompletion(fullText, line, column, requestId);
            });
        }
        
        function receiveSqlCompletions(requestId, completions) {
            console.log('[Monaco] receiveSqlCompletions #' + requestId + ' items=' + (completions ? completions.length : 0));
            resolveCompletionRequest('sql', requestId, completions);
        }
        
        function requestPythonCompletions(fullText, line, column) {
            return createCompletionRequest('python', (requestId) => {
                pyBridge.requestPythonCompletion(fullText, line, column, requestId);
            });
        }
        
        function receivePythonCompletions(requestId, completions) {
            resolveCompletionRequest('python', requestId, completions);
        }

        // Force request completion (triggered by Ctrl+. from Python)
        function forceRequestCompletion() {
            if (!editor) {
                console.log('[Monaco] No editor for force completion');
                return;
            }
            
            const model = editor.getModel();
            const position = editor.getPosition();
            
            if (!model || !position) {
                console.log('[Monaco] No model/position for force completion');
                return;
            }
            
            const fullText = model.getValue();
            const offset = model.getOffsetAt(position);
            const prefix = fullText.substring(0, offset);
            const suffix = fullText.substring(offset);
            
            console.log('[Monaco] Force completion at L' + position.lineNumber + ':C' + position.column);
            
            // Call the force bridge method (bypasses throttling on Python side)
            if (pyBridge) {
                pyBridge.forceRequestCompletion(prefix, suffix, position.lineNumber, position.column);
            }
        }
        
        // === API Functions (called from Python) ===
        
        function setDiagnostics(markers) {
            if (!editor) {
                return;
            }
            const model = editor.getModel();
            if (!model) {
                return;
            }
            const severityMap = {
                error: monaco.MarkerSeverity.Error,
                warning: monaco.MarkerSeverity.Warning,
                info: monaco.MarkerSeverity.Info,
                hint: monaco.MarkerSeverity.Hint
            };
            const mapped = (markers || []).map(function(m) {
                const sev = severityMap[(m.severity || 'error').toLowerCase()] || monaco.MarkerSeverity.Error;
                const startLine = m.startLineNumber || 1;
                const startCol = m.startColumn || 1;
                let endLine = m.endLineNumber || startLine;
                let endCol = m.endColumn || (startCol + 1);
                if (endLine === startLine && endCol <= startCol) {
                    endCol = startCol + 1;
                }
                return {
                    severity: sev,
                    message: m.message || 'Syntax error',
                    startLineNumber: startLine,
                    startColumn: startCol,
                    endLineNumber: endLine,
                    endColumn: endCol
                };
            });
            monaco.editor.setModelMarkers(model, 'datapyn-syntax', mapped);
        }

        function setValue(text) {
            if (editor) {
                editor.setValue(text || '');
            }
        }

        // Chunked setValue for large scripts — avoids one giant runJavaScript payload.
        var _setValueChunks = null;
        function beginSetValue() {
            _setValueChunks = [];
        }
        function appendSetValueChunk(chunk) {
            if (_setValueChunks) {
                _setValueChunks.push(chunk || '');
            }
        }
        function endSetValue() {
            if (!editor) {
                _setValueChunks = null;
                return;
            }
            var text = _setValueChunks ? _setValueChunks.join('') : '';
            _setValueChunks = null;
            editor.setValue(text);
        }
        
        function getValue() {
            return editor ? editor.getValue() : '';
        }
        
        function setLanguage(language) {
            currentLanguage = language;
            if (editor) {
                monaco.editor.setModelLanguage(editor.getModel(), language);
                applyLanguageCompletionUx(language);
