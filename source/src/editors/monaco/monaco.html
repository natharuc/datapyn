<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #1e1e1e;
    }
    #editor-container {
        width: 100%; height: 100%;
        contain: strict;
    }
</style>
</head>
<body>
<div id="editor-container"></div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
// ============================================================
// Monaco Editor Bridge for PyQt6 - v2 (performance optimized)
// ============================================================

var editor = null;
var bridge = null;
var pendingText = null;
var pendingLanguage = null;
var isReady = false;

// --- Debounce state for text sync ---
var _textSyncTimer = null;
var _suppressTextEvent = false;
var TEXT_SYNC_DELAY = 150; // ms - debounce interval for text sync

// --- QWebChannel setup ---
function initBridge() {
    new QWebChannel(qt.webChannelTransport, function(channel) {
        bridge = channel.objects.bridge;
        loadMonaco();
    });
}

// --- Load Monaco from local files ---
function loadMonaco() {
    var loaderScript = document.createElement('script');
    loaderScript.src = 'vs/loader.js';
    loaderScript.onload = function() {
        require.config({
            paths: { 'vs': 'vs' }
        });
        require(['vs/editor/editor.main'], function() {
            createEditor();
        });
    };
    loaderScript.onerror = function() {
        loadMonacoFromCDN();
    };
    document.head.appendChild(loaderScript);
}

function loadMonacoFromCDN() {
    var loaderScript = document.createElement('script');
    loaderScript.src = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js';
    loaderScript.onload = function() {
        require.config({
            paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs' }
        });
        require(['vs/editor/editor.main'], function() {
            createEditor();
        });
    };
    loaderScript.onerror = function() {
        if (bridge) bridge.onError('Failed to load Monaco Editor');
    };
    document.head.appendChild(loaderScript);
}

// --- Create Monaco Editor instance ---
function createEditor() {

    // Define dark theme matching VS Code Dark+
    monaco.editor.defineTheme('datapyn-dark', {
        base: 'vs-dark',
        inherit: true,
        rules: [
            { token: 'comment', foreground: '6a9955' },
            { token: 'keyword', foreground: '569cd6' },
            { token: 'string', foreground: 'ce9178' },
            { token: 'number', foreground: 'b5cea8' },
            { token: 'type', foreground: '4ec9b0' },
            { token: 'function', foreground: 'dcdcaa' },
            { token: 'variable', foreground: '9cdcfe' },
            { token: 'operator', foreground: 'd4d4d4' },
            { token: 'delimiter', foreground: 'd4d4d4' },
            { token: 'identifier', foreground: '9cdcfe' },
            { token: 'decorator', foreground: 'c586c0' }
        ],
        colors: {
            'editor.background': '#1e1e1e',
            'editor.foreground': '#d4d4d4',
            'editorLineNumber.foreground': '#858585',
            'editorLineNumber.activeForeground': '#c6c6c6',
            'editor.selectionBackground': '#264f78',
            'editor.lineHighlightBackground': '#2a2a2a',
            'editorCursor.foreground': '#c5c5c5',
            'editorBracketMatch.background': '#3e445180',
            'editorBracketMatch.border': '#61afef',
            'editor.wordHighlightBackground': '#575757b8'
        }
    });

    editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: pendingText || '',
        language: mapLanguage(pendingLanguage || 'python'),
        theme: 'datapyn-dark',
        fontFamily: 'Consolas, "Courier New", monospace',
        fontSize: 13,
        fontLigatures: false,
        lineNumbers: 'on',
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        automaticLayout: true,
        tabSize: 4,
        insertSpaces: true,
        wordWrap: 'off',
        renderWhitespace: 'none',
        cursorBlinking: 'smooth',
        cursorSmoothCaretAnimation: 'on',
        smoothScrolling: false,
        bracketPairColorization: { enabled: true },
        autoClosingBrackets: 'always',
        autoClosingQuotes: 'always',
        autoSurround: 'languageDefined',
        formatOnPaste: false,
        formatOnType: false,
        suggestOnTriggerCharacters: true,
        quickSuggestions: true,
        parameterHints: { enabled: true },
        folding: true,
        foldingStrategy: 'indentation',
        links: true,
        mouseWheelZoom: false,
        contextmenu: true,
        find: {
            addExtraSpaceOnTop: false,
            autoFindInSelection: 'never',
            seedSearchStringFromSelection: 'always'
        },
        padding: { top: 4, bottom: 4 },
        overviewRulerLanes: 0,
        hideCursorInOverviewRuler: true,
        overviewRulerBorder: false,
        scrollbar: {
            verticalScrollbarSize: 10,
            horizontalScrollbarSize: 10,
            verticalSliderSize: 10,
            horizontalSliderSize: 10,
            useShadows: false
        },
        fixedOverflowWidgets: true
    });

    pendingText = null;
    pendingLanguage = null;

    // -------------------------------------------------------
    // TEXT CHANGE: fully debounced to avoid IPC on every key
    // -------------------------------------------------------
    var _notifyTimer = null;
    var NOTIFY_DELAY = 80; // ms - debounce for textChanged signal

    editor.onDidChangeModelContent(function(e) {
        if (_suppressTextEvent) return;
        if (!bridge) return;

        // 1) Debounced lightweight notification (triggers textChanged signal)
        if (_notifyTimer) clearTimeout(_notifyTimer);
        _notifyTimer = setTimeout(function() {
            _notifyTimer = null;
            if (bridge) bridge.onTextChanged('');
        }, NOTIFY_DELAY);

        // 2) Debounced full-text sync (longer delay)
        if (_textSyncTimer) clearTimeout(_textSyncTimer);
        _textSyncTimer = setTimeout(function() {
            _textSyncTimer = null;
            if (bridge && editor) {
                bridge.onTextSynced(editor.getValue());
            }
        }, TEXT_SYNC_DELAY);
    });

    // --- Event: focus ---
    editor.onDidFocusEditorText(function() {
        if (bridge) bridge.onFocusIn();
    });

    editor.onDidBlurEditorText(function() {
        if (bridge) bridge.onFocusOut();
    });

    // --- Event: cursor position ---
    editor.onDidChangeCursorPosition(function(e) {
        if (bridge) {
            bridge.onCursorChanged(e.position.lineNumber - 1, e.position.column - 1);
        }
    });

    // --- Keybindings ---
    editor.addAction({
        id: 'execute-ctrl-enter',
        label: 'Execute Code',
        keybindings: [monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter],
        run: function() {
            // Flush pending text sync before execute
            _flushTextSync();
            if (bridge) bridge.onExecuteRequested();
        }
    });

    editor.addAction({
        id: 'execute-shift-enter',
        label: 'Execute Code (Shift)',
        keybindings: [monaco.KeyMod.Shift | monaco.KeyCode.Enter],
        run: function() {
            _flushTextSync();
            if (bridge) bridge.onExecuteRequested();
        }
    });

    editor.addAction({
        id: 'execute-f5',
        label: 'Execute Code (F5)',
        keybindings: [monaco.KeyCode.F5],
        run: function() {
            _flushTextSync();
            if (bridge) bridge.onExecuteRequested();
        }
    });

    isReady = true;
    if (bridge) {
        try { bridge.onEditorReady(); } catch(e) {
            setTimeout(function() {
                try { bridge.onEditorReady(); } catch(e2) {}
            }, 100);
        }
    }

    // Register completion providers after editor is ready
    _registerSqlCompletionProvider();
    _registerPythonCompletionProvider();
}

// --- Flush pending text sync immediately ---
function _flushTextSync() {
    if (_notifyTimer) {
        clearTimeout(_notifyTimer);
        _notifyTimer = null;
    }
    if (_textSyncTimer) {
        clearTimeout(_textSyncTimer);
        _textSyncTimer = null;
    }
    if (bridge && editor) {
        bridge.onTextSynced(editor.getValue());
    }
}

// --- Language mapping ---
function mapLanguage(lang) {
    switch (lang) {
        case 'python': return 'python';
        case 'sql': return 'sql';
        case 'cross': return 'sql';
        default: return 'python';
    }
}

// ============================================================
// API called from Python via runJavaScript
// ============================================================

function api_setText(text) {
    if (editor) {
        _suppressTextEvent = true;
        var fullRange = editor.getModel().getFullModelRange();
        editor.executeEdits('api', [{
            range: fullRange,
            text: text,
            forceMoveMarkers: true
        }]);
        editor.setPosition({ lineNumber: 1, column: 1 });
        _suppressTextEvent = false;
    } else {
        pendingText = text;
    }
}

function api_getText() {
    return editor ? editor.getValue() : (pendingText || '');
}

function api_getSelectedText() {
    if (!editor) return '';
    var selection = editor.getSelection();
    if (!selection || selection.isEmpty()) return '';
    return editor.getModel().getValueInRange(selection);
}

function api_hasSelection() {
    if (!editor) return false;
    var selection = editor.getSelection();
    return selection && !selection.isEmpty();
}

function api_setLanguage(lang) {
    if (editor) {
        var model = editor.getModel();
        if (model) {
            monaco.editor.setModelLanguage(model, mapLanguage(lang));
        }
    } else {
        pendingLanguage = lang;
    }
}

function api_getLanguage() {
    if (editor) {
        var model = editor.getModel();
        return model ? model.getLanguageId() : 'python';
    }
    return pendingLanguage || 'python';
}

function api_setReadOnly(readOnly) {
    if (editor) {
        editor.updateOptions({ readOnly: readOnly });
    }
}

function api_setLineNumbers(visible) {
    if (editor) {
        editor.updateOptions({ lineNumbers: visible ? 'on' : 'off' });
    }
}

function api_getLineCount() {
    return editor ? editor.getModel().getLineCount() : 0;
}

function api_getCurrentLine() {
    if (!editor) return 0;
    return editor.getPosition().lineNumber - 1;
}

function api_goToLine(line) {
    if (editor) {
        var lineNumber = line + 1;
        editor.setPosition({ lineNumber: lineNumber, column: 1 });
        editor.revealLineInCenter(lineNumber);
    }
}

function api_setFont(family, size) {
    if (editor) {
        editor.updateOptions({ fontFamily: family, fontSize: size });
    }
}

function api_setTheme(themeName) {
    if (editor) {
        if (themeName === 'dark' || themeName === 'datapyn-dark') {
            monaco.editor.setTheme('datapyn-dark');
        } else if (themeName === 'light') {
            monaco.editor.setTheme('vs');
        } else {
            monaco.editor.setTheme(themeName);
        }
    }
}

function api_focus() {
    if (editor) {
        editor.focus();
    }
}

function api_layout() {
    if (editor) {
        editor.layout();
    }
}

// --- Register SQL completion provider ---
function _registerSqlCompletionProvider() {
    monaco.languages.registerCompletionItemProvider('sql', {
        triggerCharacters: ['.', ' ', '(', ','],

        provideCompletionItems: function(model, position) {
            var textUntilPosition = model.getValueInRange({
                startLineNumber: 1,
                startColumn: 1,
                endLineNumber: position.lineNumber,
                endColumn: position.column
            });
            var currentLine = model.getLineContent(position.lineNumber);
            var textBeforeCursor = currentLine.substring(0, position.column - 1);

            var word = model.getWordUntilPosition(position);
            var range = {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: word.startColumn,
                endColumn: word.endColumn
            };

            var suggestions = [];

            // Check if we're after a dot (table.column completion)
            var dotMatch = textBeforeCursor.match(/(\w+)\.\s*$/);
            if (dotMatch) {
                var tableName = dotMatch[1];
                // Search table columns (case insensitive)
                var tableKey = null;
                for (var key in _sqlSchema.columns) {
                    if (key.toLowerCase() === tableName.toLowerCase()) {
                        tableKey = key;
                        break;
                    }
                }
                if (tableKey && _sqlSchema.columns[tableKey]) {
                    _sqlSchema.columns[tableKey].forEach(function(col) {
                        suggestions.push({
                            label: col.name,
                            kind: monaco.languages.CompletionItemKind.Field,
                            detail: col.type + (col.nullable === 'NO' ? ' NOT NULL' : ''),
                            insertText: col.name,
                            range: range,
                            sortText: '0' + col.name  // columns first
                        });
                    });
                }
                return { suggestions: suggestions };
            }

            // Context detection: after FROM/JOIN -> prioritize tables
            var upperText = textUntilPosition.toUpperCase();
            var afterFrom = /(?:FROM|JOIN|INTO|UPDATE|TABLE)\s+(?:\w+\s*,\s*)*$/i.test(textBeforeCursor);

            // Add table suggestions
            _sqlSchema.tables.forEach(function(table) {
                var detail = table.type || 'TABLE';
                if (table.schema && table.schema !== 'dbo') {
                    detail += ' (' + table.schema + ')';
                }
                suggestions.push({
                    label: table.name,
                    kind: monaco.languages.CompletionItemKind.Struct,
                    detail: detail,
                    insertText: table.name,
                    range: range,
                    sortText: afterFrom ? '0' + table.name : '3' + table.name
                });
            });

            // Add column suggestions (all columns, lower priority when not after dot)
            for (var tbl in _sqlSchema.columns) {
                _sqlSchema.columns[tbl].forEach(function(col) {
                    suggestions.push({
                        label: col.name,
                        kind: monaco.languages.CompletionItemKind.Field,
                        detail: col.type + ' (' + tbl + ')',
                        insertText: col.name,
                        range: range,
                        sortText: '2' + col.name
                    });
                });
            }

            // Add SQL keywords
            _sqlKeywords.forEach(function(kw) {
                suggestions.push({
                    label: kw,
                    kind: monaco.languages.CompletionItemKind.Keyword,
                    insertText: kw,
                    range: range,
                    sortText: '5' + kw
                });
            });

            // Add SQL functions
            _sqlFunctions.forEach(function(fn) {
                suggestions.push({
                    label: fn,
                    kind: monaco.languages.CompletionItemKind.Function,
                    insertText: fn + '($0)',
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: 'function',
                    range: range,
                    sortText: '4' + fn
                });
            });

            // Add data types
            _sqlDataTypes.forEach(function(dt) {
                suggestions.push({
                    label: dt,
                    kind: monaco.languages.CompletionItemKind.TypeParameter,
                    insertText: dt,
                    detail: 'data type',
                    range: range,
                    sortText: '6' + dt
                });
            });

            return { suggestions: suggestions };
        }
    });
}

// --- Register Python completion provider ---
function _registerPythonCompletionProvider() {
    monaco.languages.registerCompletionItemProvider('python', {
        triggerCharacters: ['.', ' '],

        provideCompletionItems: function(model, position) {
            var currentLine = model.getLineContent(position.lineNumber);
            var textBeforeCursor = currentLine.substring(0, position.column - 1);

            var word = model.getWordUntilPosition(position);
            var range = {
                startLineNumber: position.lineNumber,
                endLineNumber: position.lineNumber,
                startColumn: word.startColumn,
                endColumn: word.endColumn
            };

            var suggestions = [];

            // Check if after dot (attribute completion)
            var dotMatch = textBeforeCursor.match(/(\w+)\.\s*$/);
            if (dotMatch) {
                var varName = dotMatch[1];
                var varType = _pythonNamespace[varName] || '';

                // If it's a DataFrame or pandas object
                if (varType === 'DataFrame' || varType === 'Series' || varName === 'pd') {
                    _pandasMethods.forEach(function(method) {
                        suggestions.push({
                            label: method,
                            kind: monaco.languages.CompletionItemKind.Method,
                            insertText: method,
                            detail: 'pandas',
                            range: range,
                            sortText: '0' + method
                        });
                    });
                }

                // If it's a string
                if (varType === 'str') {
                    ['upper', 'lower', 'strip', 'lstrip', 'rstrip', 'split',
                     'replace', 'find', 'index', 'count', 'startswith',
                     'endswith', 'join', 'format', 'encode', 'decode',
                     'title', 'capitalize', 'swapcase', 'center', 'ljust',
                     'rjust', 'zfill', 'isdigit', 'isalpha', 'isalnum',
                     'isupper', 'islower'].forEach(function(m) {
                        suggestions.push({
                            label: m,
                            kind: monaco.languages.CompletionItemKind.Method,
                            insertText: m,
                            detail: 'str method',
                            range: range
                        });
                    });
                }

                // If it's a list
                if (varType === 'list') {
                    ['append', 'extend', 'insert', 'remove', 'pop', 'clear',
                     'index', 'count', 'sort', 'reverse', 'copy'].forEach(function(m) {
                        suggestions.push({
                            label: m,
                            kind: monaco.languages.CompletionItemKind.Method,
                            insertText: m,
                            detail: 'list method',
                            range: range
                        });
                    });
                }

                // If it's a dict
                if (varType === 'dict') {
                    ['keys', 'values', 'items', 'get', 'pop', 'popitem',
                     'update', 'setdefault', 'clear', 'copy',
                     'fromkeys'].forEach(function(m) {
                        suggestions.push({
                            label: m,
                            kind: monaco.languages.CompletionItemKind.Method,
                            insertText: m,
                            detail: 'dict method',
                            range: range
                        });
                    });
                }

                // If it's a set
                if (varType === 'set') {
                    ['add', 'remove', 'discard', 'pop', 'clear', 'copy',
                     'union', 'intersection', 'difference', 'symmetric_difference',
                     'update', 'issubset', 'issuperset'].forEach(function(m) {
                        suggestions.push({
                            label: m,
                            kind: monaco.languages.CompletionItemKind.Method,
                            insertText: m,
                            detail: 'set method',
                            range: range
                        });
                    });
                }

                // Generic - always offer common dunder/methods
                if (suggestions.length === 0) {
                    ['__init__', '__str__', '__repr__', '__len__',
                     '__getitem__', '__setitem__', '__contains__'].forEach(function(m) {
                        suggestions.push({
                            label: m,
                            kind: monaco.languages.CompletionItemKind.Method,
                            insertText: m,
                            detail: 'magic method',
                            range: range,
                            sortText: '9' + m
                        });
                    });
                }

                return { suggestions: suggestions };
            }

            // Check if after 'import ' or 'from '
            var importMatch = textBeforeCursor.match(/(?:import|from)\s+$/);
            if (importMatch) {
                ['os', 'sys', 'json', 'csv', 'math', 'random', 'datetime',
                 'collections', 'itertools', 'functools', 're', 'pathlib',
                 'typing', 'dataclasses', 'abc', 'io', 'copy', 'time',
                 'pandas', 'numpy', 'matplotlib', 'openpyxl',
                 'sqlalchemy'].forEach(function(mod) {
                    suggestions.push({
                        label: mod,
                        kind: monaco.languages.CompletionItemKind.Module,
                        insertText: mod,
                        detail: 'module',
                        range: range,
                        sortText: '0' + mod
                    });
                });
                return { suggestions: suggestions };
            }

            // Add namespace variables (from executed code)
            for (var name in _pythonNamespace) {
                var vType = _pythonNamespace[name];
                var kind = monaco.languages.CompletionItemKind.Variable;
                if (vType === 'function') kind = monaco.languages.CompletionItemKind.Function;
                else if (vType === 'module') kind = monaco.languages.CompletionItemKind.Module;
                else if (vType === 'type' || vType === 'class') kind = monaco.languages.CompletionItemKind.Class;
                else if (vType === 'DataFrame') kind = monaco.languages.CompletionItemKind.Struct;

                suggestions.push({
                    label: name,
                    kind: kind,
                    detail: vType || 'variable',
                    insertText: name,
                    range: range,
                    sortText: '1' + name
                });
            }

            // Add Python keywords
            _pythonKeywords.forEach(function(kw) {
                suggestions.push({
                    label: kw,
                    kind: monaco.languages.CompletionItemKind.Keyword,
                    insertText: kw,
                    range: range,
                    sortText: '5' + kw
                });
            });

            // Add Python builtins
            _pythonBuiltins.forEach(function(b) {
                suggestions.push({
                    label: b,
                    kind: monaco.languages.CompletionItemKind.Function,
                    insertText: b,
                    detail: 'builtin',
                    range: range,
                    sortText: '4' + b
                });
            });

            // Common snippet templates
            var snippets = [
                { label: 'def', detail: 'function definition', text: 'def ${1:name}(${2:params}):\n    ${3:pass}' },
                { label: 'class', detail: 'class definition', text: 'class ${1:Name}:\n    def __init__(self${2:}):\n        ${3:pass}' },
                { label: 'for', detail: 'for loop', text: 'for ${1:item} in ${2:iterable}:\n    ${3:pass}' },
                { label: 'if', detail: 'if statement', text: 'if ${1:condition}:\n    ${2:pass}' },
                { label: 'ifelse', detail: 'if-else', text: 'if ${1:condition}:\n    ${2:pass}\nelse:\n    ${3:pass}' },
                { label: 'try', detail: 'try-except', text: 'try:\n    ${1:pass}\nexcept ${2:Exception} as ${3:e}:\n    ${4:pass}' },
                { label: 'with', detail: 'with statement', text: 'with ${1:expression} as ${2:var}:\n    ${3:pass}' },
                { label: 'while', detail: 'while loop', text: 'while ${1:condition}:\n    ${2:pass}' },
                { label: 'lambda', detail: 'lambda expression', text: 'lambda ${1:x}: ${2:x}' },
                { label: 'list_comp', detail: 'list comprehension', text: '[${1:x} for ${2:x} in ${3:iterable}]' },
                { label: 'dict_comp', detail: 'dict comprehension', text: '{${1:k}: ${2:v} for ${3:k}, ${4:v} in ${5:iterable}}' },
            ];
            snippets.forEach(function(s) {
                suggestions.push({
                    label: s.label,
                    kind: monaco.languages.CompletionItemKind.Snippet,
                    insertText: s.text,
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    detail: s.detail,
                    range: range,
                    sortText: '7' + s.label
                });
            });

            return { suggestions: suggestions };
        }
    });
}

// ============================================================
// API for Python to update autocomplete data
// ============================================================

function api_setSqlSchema(schemaJson) {
    /**
     * Recebe schema do banco para autocomplete SQL.
     * schemaJson: JSON string com {tables: [...], columns: {...}, database: ''}
     */
    try {
        _sqlSchema = JSON.parse(schemaJson);
    } catch(e) {
        // fallback: try as object
        if (typeof schemaJson === 'object') {
            _sqlSchema = schemaJson;
        }
    }
}

function api_setPythonNamespace(nsJson) {
    /**
     * Recebe namespace Python para autocomplete.
     * nsJson: JSON string com {varName: typeName, ...}
     */
    try {
        _pythonNamespace = JSON.parse(nsJson);
    } catch(e) {
        if (typeof nsJson === 'object') {
            _pythonNamespace = nsJson;
        }
    }
}

function api_clearSqlSchema() {
    _sqlSchema = { tables: [], columns: {}, database: '' };
}

function api_clearPythonNamespace() {
    _pythonNamespace = {};
}

// Initialize on load
if (typeof qt !== 'undefined') {
    initBridge();
} else {
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof qt !== 'undefined') {
            initBridge();
        }
    });
}
</script>
