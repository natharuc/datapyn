<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/js/atom-one-dark.min.css">
    <script src="../assets/js/highlight.min.js"></script>
    <script src="../assets/js/marked.min.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
        :root {
            --bg-primary: #0c111b;
            --bg-secondary: #121a2b;
            --bg-tertiary: #161f30;
            --text-primary: #eef2f7;
            --text-secondary: #b8c5d9;
            --text-tertiary: #8b9cb3;
            --border-default: rgba(148, 163, 184, 0.18);
            --accent-primary: #3369ff;
            --accent-hover: #4d7dff;
            --user-bubble: #0078d4;
            --assistant-bubble: #2d2d30;
            --error-bg: #442222;
            --error-border: #ff4444;
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Ubuntu', 'Roboto', -apple-system, BlinkMacSystemFont, Oxygen, sans-serif;
            font-size: 13px;
            line-height: 1.5;
        }

        #chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #messages::-webkit-scrollbar {
            width: 8px;
        }

        #messages::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        #messages::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        /* Welcome message */
        #welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
            color: var(--text-tertiary);
            padding: 40px 20px;
        }

        #welcome.hidden {
            display: none;
        }

        #welcome h2 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        #welcome p {
            font-size: 13px;
            max-width: 280px;
        }

        #welcome-logo {
            width: 72px;
            height: 72px;
            margin-bottom: 16px;
            object-fit: contain;
        }

        /* Message bubbles */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message.error {
            align-self: flex-start;
        }

        .bubble {
            padding: 10px 13px;
            border-radius: var(--radius);
            word-wrap: break-word;
            overflow-wrap: break-word;
            hyphens: auto;
        }

        .message.user .bubble {
            background-color: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .bubble {
            background-color: var(--assistant-bubble);
            background-color: color-mix(in srgb, var(--assistant-bubble) 82%, transparent);
            border: 1px solid var(--border-default);
            border-bottom-left-radius: 4px;
        }

        .message.error .bubble {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: #ff6b6b;
        }

        .timestamp {
            font-size: 10px;
            color: var(--text-tertiary);
            margin-top: 4px;
            padding: 0 4px;
        }

        .message.user .timestamp {
            text-align: right;
            color: rgba(255, 255, 255, 0.5);
        }

        /* Markdown content */
        .bubble p {
            margin: 0 0 8px 0;
        }

        .bubble p:last-child {
            margin-bottom: 0;
        }

        .bubble code {
            background-color: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace;
            font-size: 12px;
        }

        .bubble pre {
            background-color: var(--bg-primary);
            background-color: color-mix(in srgb, var(--bg-primary) 88%, black);
            border-radius: 6px;
            padding: 12px;
            margin: 8px 0;
            overflow-x: auto;
            border: 1px solid var(--border-default);
        }

        .bubble pre code {
            background: none;
            padding: 0;
            font-size: 12px;
            line-height: 1.4;
        }

        .bubble ul, .bubble ol {
            margin: 8px 0;
            padding-left: 20px;
        }

        .bubble li {
            margin: 4px 0;
        }

        .bubble a {
            color: var(--accent-hover);
            text-decoration: none;
        }

        .bubble a:hover {
            text-decoration: underline;
        }

        .bubble blockquote {
            border-left: 3px solid var(--accent-primary);
            padding-left: 12px;
            margin: 8px 0;
            color: var(--text-secondary);
        }

        .bubble table {
            border-collapse: collapse;
            margin: 8px 0;
            width: 100%;
        }

        .bubble th, .bubble td {
            border: 1px solid var(--border-default);
            padding: 6px 10px;
            text-align: left;
        }

        .bubble th {
            background-color: var(--bg-tertiary);
        }

        /* Thinking indicator (simple dots) */
        .thinking {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 14px;
            background-color: var(--assistant-bubble);
            border: 1px solid var(--border-default);
            border-radius: var(--radius);
            align-self: flex-start;
        }

        .thinking.hidden {
            display: none;
        }

        .thinking-text {
            color: var(--text-tertiary);
            font-style: italic;
        }

        .thinking-dots {
            display: flex;
            gap: 3px;
        }

        .thinking-dots span {
            width: 4px;
            height: 4px;
            background-color: var(--text-tertiary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(1) { animation-delay: 0s; }
        .thinking-dots span:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Collapsible thinking block (reasoning) */
        .thinking-block {
            align-self: flex-start;
            max-width: 88%;
            margin: 4px 0;
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeIn 0.2s ease-out;
        }

        .thinking-block-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
            background-color: transparent;
            transition: background-color 0.15s ease;
            border-radius: var(--radius);
        }

        .thinking-block-header:hover {
            background-color: rgba(255, 255, 255, 0.04);
        }

        .thinking-block-toggle {
            font-size: 10px;
            color: var(--text-tertiary);
            transition: transform 0.2s ease;
            width: 12px;
            text-align: center;
            flex-shrink: 0;
        }

        .thinking-block.expanded .thinking-block-toggle {
            transform: rotate(90deg);
        }

        .thinking-block-sparkle {
            color: var(--accent-primary);
            font-size: 14px;
            flex-shrink: 0;
        }

        .thinking-block.active .thinking-block-sparkle {
            animation: sparkle-pulse 1.5s ease-in-out infinite;
        }

        @keyframes sparkle-pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .thinking-block-title {
            color: var(--text-tertiary);
            font-style: italic;
            font-size: 12px;
            flex: 1;
        }

        .thinking-block-duration {
            color: var(--text-tertiary);
            font-size: 10px;
            flex-shrink: 0;
        }

        .thinking-block-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background-color: rgba(0, 0, 0, 0.12);
            border-radius: 0 0 var(--radius) var(--radius);
        }

        .thinking-block.expanded .thinking-block-content {
            max-height: 300px;
            overflow-y: auto;
            padding: 10px 14px;
        }

        .thinking-block-content::-webkit-scrollbar {
            width: 6px;
        }

        .thinking-block-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .thinking-block-content::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 3px;
        }

        .thinking-block-text {
            color: var(--text-tertiary);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Ubuntu', 'Roboto', -apple-system, sans-serif;
        }

        /* Tool use group - collapsible */
        .tool-group {
            background-color: var(--bg-tertiary);
            background-color: color-mix(in srgb, var(--bg-tertiary) 88%, transparent);
            border: 1px solid var(--border-default);
            border-left: 3px solid var(--accent-primary);
            border-radius: 6px;
            margin: 8px 0;
            font-size: 12px;
            color: var(--text-secondary);
            overflow: hidden;
        }

        .tool-group-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s ease;
        }

        .tool-group-header:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .tool-group-toggle {
            font-size: 10px;
            color: var(--text-tertiary);
            transition: transform 0.2s ease;
            width: 12px;
            text-align: center;
        }

        .tool-group.expanded .tool-group-toggle {
            transform: rotate(90deg);
        }

        .tool-group-icon {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 120, 212, 0.18);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-primary) 20%, transparent);
            animation: pulse 1.2s ease-in-out infinite;
        }

        .tool-group.complete .tool-group-icon {
            animation: none;
            box-shadow: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 1; }
        }

        .tool-group-title {
            flex: 1;
            font-style: italic;
        }

        .tool-group-count {
            background-color: var(--accent-primary);
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 500;
        }

        .tool-group-list {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            background-color: rgba(0, 0, 0, 0.15);
        }

        .tool-group.expanded .tool-group-list {
            max-height: 200px;
            overflow-y: auto;
            padding-bottom: 4px;
        }

        .tool-group.expanded .tool-group-list::-webkit-scrollbar {
            width: 6px;
        }

        .tool-group.expanded .tool-group-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .tool-group.expanded .tool-group-list::-webkit-scrollbar-thumb {
            background: var(--border-default);
            border-radius: 3px;
        }

        .tool-group.expanded .tool-group-list::-webkit-scrollbar-thumb:hover {
            background: var(--text-tertiary);
        }

        .tool-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px 6px 32px;
            border-top: 1px solid var(--border-default);
        }

        .tool-item:first-child {
            border-top: none;
        }

        .tool-item-name {
            color: var(--accent-hover);
            font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
        }

        .tool-item-status {
            margin-left: auto;
            font-size: 10px;
        }

        .tool-item-status.running {
            color: var(--text-tertiary);
            font-style: italic;
        }

        .tool-item-status.done {
            color: #4ec9b0;
        }

        .tool-item-status.error {
            color: #f14c4c;
        }

        .tool-item-args {
            color: var(--text-tertiary);
            font-size: 10px;
            font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 200px;
        }

        .tool-item-result {
            display: none;
            padding: 4px 12px 6px 32px;
            font-size: 10px;
            color: var(--text-tertiary);
            font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
        }

        .tool-group.expanded .tool-item-result.has-result {
            display: block;
        }

        /* Copy button for code blocks */
        .code-block-wrapper {
            position: relative;
        }

        .code-action-btns {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 1;
        }

        .code-block-wrapper:hover .code-action-btns {
            opacity: 1;
        }

        .copy-btn, .insert-btn {
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            border: 1px solid var(--border-default);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 10px;
            cursor: pointer;
            font-family: inherit;
        }

        .copy-btn:hover, .insert-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        .copy-btn.copied {
            background: var(--accent-primary);
            color: white;
        }

        .insert-btn.inserted {
            background: var(--accent-primary);
            color: white;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="messages">
            <div id="welcome">
                <img id="welcome-logo" alt="" />
                <h2></h2>
                <p></p>
            </div>
            <div id="thinking" class="thinking hidden">
                <span class="thinking-text"></span>
                <div class="thinking-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        var pyBridge = null;
        var currentStreamingId = null;

        // i18n labels - defaults, overridden by setLabels()
        var labels = {
            thinking: '',
            thinking_complete: '',
            tool_processing: '',
            tool_using_one: '',
            tool_using_many: '',
            tool_used_one: '',
            tool_used_many: '',
            tool_running: '',
            tool_ok: '',
            tool_error: '',
            copy: '',
            copied: '',
            insert: '',
            inserted: ''
        };

        function setLabels(newLabels) {
            for (var key in newLabels) {
                if (newLabels.hasOwnProperty(key)) {
                    labels[key] = newLabels[key];
                }
            }
            var thinkingText = document.querySelector('#thinking .thinking-text');
            if (thinkingText) thinkingText.textContent = labels.thinking || '';
        }

        // Initialize QWebChannel
        function initWebChannel() {
            if (typeof QWebChannel === 'undefined') {
                setTimeout(initWebChannel, 50);
                return;
            }
            new QWebChannel(qt.webChannelTransport, function(channel) {
                pyBridge = channel.objects.bridge;
                if (pyBridge && pyBridge.onWebViewReady) {
                    pyBridge.onWebViewReady();
                }
            });
        }
        initWebChannel();

        // Configure marked for markdown rendering with custom code block wrapper
        marked.use({
            breaks: true,
            gfm: true,
            renderer: {
                code: function(token) {
                    var lang = token.lang || '';
                    var code = token.text || '';
                    var langClass = lang ? ' class="language-' + lang + '"' : '';
                    var highlighted;
                    if (lang && hljs.getLanguage(lang)) {
                        try {
                            highlighted = hljs.highlight(code, { language: lang }).value;
                        } catch (e) {
                            highlighted = escapeHtml(code);
                        }
                    } else {
                        try {
                            highlighted = hljs.highlightAuto(code).value;
                        } catch (e) {
                            highlighted = escapeHtml(code);
                        }
                    }
                    return '<div class="code-block-wrapper">' +
                        '<div class="code-action-btns">' +
                        '<button class="insert-btn" onclick="insertCode(this)">' + (labels.insert || '') + '</button>' +
                        '<button class="copy-btn" onclick="copyCode(this)">' + (labels.copy || '') + '</button>' +
                        '</div>' +
                        '<pre><code' + langClass + '>' + highlighted + '</code></pre>' +
                        '</div>';
                }
            }
        });

        function renderMarkdown(text) {
            return marked.parse(text);
        }

        function copyCode(btn) {
            var wrapper = btn.closest('.code-block-wrapper');
            var codeEl = wrapper ? wrapper.querySelector('code') : null;
            if (!codeEl) return;
            var text = codeEl.textContent;
            navigator.clipboard.writeText(text).then(function() {
                btn.textContent = labels.copied || '';
                btn.classList.add('copied');
                setTimeout(function() {
                    btn.textContent = labels.copy || '';
                    btn.classList.remove('copied');
                }, 1500);
            });
        }

        function insertCode(btn) {
            var wrapper = btn.closest('.code-block-wrapper');
            var codeEl = wrapper ? wrapper.querySelector('code') : null;
            if (!codeEl) return;
            var text = codeEl.textContent;
            if (pyBridge && pyBridge.insertCode) {
                pyBridge.insertCode(text);
                btn.textContent = labels.inserted || '';
                btn.classList.add('inserted');
                setTimeout(function() {
                    btn.textContent = labels.insert || '';
                    btn.classList.remove('inserted');
                }, 1500);
            }
        }

        function getTimestamp() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + 
                   now.getMinutes().toString().padStart(2, '0');
        }

        function hideWelcome() {
            document.getElementById('welcome').classList.add('hidden');
        }

        function showWelcome() {
            document.getElementById('welcome').classList.remove('hidden');
        }

        function setWelcomeText(title, message) {
            const welcome = document.getElementById('welcome');
            welcome.querySelector('h2').textContent = title;
            welcome.querySelector('p').textContent = message;
        }

        function setWelcomeLogo(dataUri) {
            const img = document.getElementById('welcome-logo');
            if (!img) {
                return;
            }
            img.src = dataUri || '';
            img.style.display = dataUri ? 'block' : 'none';
        }

        function addMessage(role, content, id) {
            hideWelcome();
            
            const messages = document.getElementById('messages');
            const thinking = document.getElementById('thinking');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + role;
            if (id) msgDiv.id = 'msg-' + id;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            // Render markdown for assistant messages
            if (role === 'assistant' || role === 'error') {
                bubble.innerHTML = renderMarkdown(content);
            } else {
                bubble.textContent = content;
            }
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = getTimestamp();
            
            msgDiv.appendChild(bubble);
            msgDiv.appendChild(timestamp);
            
            // Insert before thinking indicator
            messages.insertBefore(msgDiv, thinking);
            
            scrollToBottom();
            return msgDiv.id || null;
        }

        function appendToMessage(id, content) {
            const msgDiv = document.getElementById('msg-' + id);
            if (msgDiv) {
                const bubble = msgDiv.querySelector('.bubble');
                const currentText = bubble.getAttribute('data-raw') || '';
                const newText = currentText + content;
                bubble.setAttribute('data-raw', newText);
                bubble.innerHTML = renderMarkdown(newText);
                scrollToBottom();
            }
        }

        function startStreaming() {
            currentStreamingId = 'stream-' + Date.now();
            hideWelcome();
            
            const messages = document.getElementById('messages');
            const thinking = document.getElementById('thinking');
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant';
            msgDiv.id = 'msg-' + currentStreamingId;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.setAttribute('data-raw', '');
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = getTimestamp();
            
            msgDiv.appendChild(bubble);
            msgDiv.appendChild(timestamp);
            
            messages.insertBefore(msgDiv, thinking);
            
            return currentStreamingId;
        }

        // Debounced markdown rendering for streaming
        var _streamBuffer = '';
        var _streamTimer = null;
        var _streamFlushDelay = 80; // ms

        function _flushStream() {
            _streamTimer = null;
            if (!currentStreamingId || !_streamBuffer) return;
            var msgDiv = document.getElementById('msg-' + currentStreamingId);
            if (!msgDiv) return;
            var bubble = msgDiv.querySelector('.bubble');
            var raw = (bubble.getAttribute('data-raw') || '') + _streamBuffer;
            bubble.setAttribute('data-raw', raw);
            bubble.innerHTML = renderMarkdown(raw);
            _streamBuffer = '';
            scrollToBottom();
        }

        function streamChunk(content) {
            if (!currentStreamingId) return;
            _streamBuffer += content;
            if (!_streamTimer) {
                _streamTimer = setTimeout(_flushStream, _streamFlushDelay);
            }
        }

        function endStreaming() {
            // Flush any remaining buffered content
            if (_streamTimer) {
                clearTimeout(_streamTimer);
                _streamTimer = null;
            }
            if (_streamBuffer && currentStreamingId) {
                _flushStream();
            }
            _streamBuffer = '';
            currentStreamingId = null;
        }

        function showThinking() {
            document.getElementById('thinking').classList.remove('hidden');
            scrollToBottom();
        }

        function hideThinking() {
            document.getElementById('thinking').classList.add('hidden');
        }

        // Tool group management
        var currentToolGroup = null;
        var toolCount = 0;

        // Thinking block management
        var currentThinkingBlock = null;
        var thinkingStartTime = null;

        function startThinkingBlock() {
            // End any existing thinking block first
            if (currentThinkingBlock) {
                endThinkingBlock();
            }

            hideWelcome();
            var messages = document.getElementById('messages');
            var thinking = document.getElementById('thinking');

            var blockDiv = document.createElement('div');
            blockDiv.className = 'thinking-block active expanded';
            blockDiv.id = 'thinking-block-' + Date.now();

            blockDiv.innerHTML =
                '<div class="thinking-block-header" onclick="toggleThinkingBlock(\'' + blockDiv.id + '\')">' +
                    '<span class="thinking-block-toggle">&#9654;</span>' +
                    '<span class="thinking-block-sparkle">*</span>' +
                    '<span class="thinking-block-title">' + labels.thinking + '...</span>' +
                    '<span class="thinking-block-duration"></span>' +
                '</div>' +
                '<div class="thinking-block-content">' +
                    '<div class="thinking-block-text"></div>' +
                '</div>';

            messages.insertBefore(blockDiv, thinking);
            currentThinkingBlock = blockDiv;
            thinkingStartTime = Date.now();
            scrollToBottom();
        }

        function appendThinking(text) {
            if (!currentThinkingBlock) {
                startThinkingBlock();
            }
            var textEl = currentThinkingBlock.querySelector('.thinking-block-text');
            if (textEl) {
                textEl.textContent += text;
                scrollToBottom();
            }
        }

        function endThinkingBlock() {
            if (!currentThinkingBlock) return;

            currentThinkingBlock.classList.remove('active');
            currentThinkingBlock.classList.remove('expanded');

            // Update title with duration
            var elapsed = thinkingStartTime ? Math.round((Date.now() - thinkingStartTime) / 1000) : 0;
            var titleEl = currentThinkingBlock.querySelector('.thinking-block-title');
            if (titleEl) {
                titleEl.textContent = labels.thinking_complete.replace('{seconds}', elapsed);
            }
            var durationEl = currentThinkingBlock.querySelector('.thinking-block-duration');
            if (durationEl) {
                durationEl.textContent = elapsed + 's';
            }

            currentThinkingBlock = null;
            thinkingStartTime = null;
        }

        function toggleThinkingBlock(blockId) {
            var block = document.getElementById(blockId);
            if (block) {
                block.classList.toggle('expanded');
            }
        }

        function startToolGroup() {
            // Create a new tool group if none exists
            if (currentToolGroup) return;
            
            hideWelcome();
            const messages = document.getElementById('messages');
            const thinking = document.getElementById('thinking');
            
            const groupDiv = document.createElement('div');
            groupDiv.className = 'tool-group';
            groupDiv.id = 'tool-group-' + Date.now();
            
            groupDiv.innerHTML = `
                <div class="tool-group-header" onclick="toggleToolGroup('${groupDiv.id}')">
                    <span class="tool-group-toggle">&#9654;</span>
                    <span class="tool-group-icon"></span>
                    <span class="tool-group-title">${labels.tool_processing}</span>
                    <span class="tool-group-count">0</span>
                </div>
                <div class="tool-group-list"></div>
            `;
            
            messages.insertBefore(groupDiv, thinking);
            currentToolGroup = groupDiv;
            toolCount = 0;
            scrollToBottom();
        }

        function addToolUse(toolName, argSummary) {
            // Auto-create group if needed
            if (!currentToolGroup) {
                startToolGroup();
            }
            
            toolCount++;
            
            // Update header count
            const countSpan = currentToolGroup.querySelector('.tool-group-count');
            countSpan.textContent = toolCount;
            
            // Update title
            const titleSpan = currentToolGroup.querySelector('.tool-group-title');
            if (toolCount === 1) {
                titleSpan.textContent = labels.tool_using_one;
            } else {
                titleSpan.textContent = labels.tool_using_many.replace('{count}', toolCount);
            }
            
            // Add tool item to list
            const list = currentToolGroup.querySelector('.tool-group-list');
            const itemDiv = document.createElement('div');
            itemDiv.className = 'tool-item';
            itemDiv.setAttribute('data-tool', toolName);
            var argsHtml = argSummary ? '<span class="tool-item-args">(' + escapeHtml(argSummary) + ')</span>' : '';
            itemDiv.innerHTML =
                '<span class="tool-item-name">' + escapeHtml(toolName) + '</span>' +
                argsHtml +
                '<span class="tool-item-status running">' + labels.tool_running + '</span>';
            list.appendChild(itemDiv);
            
            // Add result preview row (hidden until result arrives)
            var resultDiv = document.createElement('div');
            resultDiv.className = 'tool-item-result';
            resultDiv.setAttribute('data-tool-result', toolName);
            list.appendChild(resultDiv);
            
            scrollToBottom();
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateToolStatus(toolName, status, isError, resultPreview) {
            if (!currentToolGroup) return;
            
            var items = currentToolGroup.querySelectorAll('.tool-item');
            for (var i = 0; i < items.length; i++) {
                var item = items[i];
                if (item.getAttribute('data-tool') === toolName) {
                    var statusSpan = item.querySelector('.tool-item-status');
                    statusSpan.classList.remove('running');
                    if (isError) {
                        statusSpan.classList.add('error');
                        statusSpan.textContent = labels.tool_error;
                    } else {
                        statusSpan.classList.add('done');
                        statusSpan.textContent = labels.tool_ok;
                    }
                    break;
                }
            }
            
            // Show result preview if provided
            if (resultPreview) {
                var resultDivs = currentToolGroup.querySelectorAll('.tool-item-result');
                for (var j = 0; j < resultDivs.length; j++) {
                    if (resultDivs[j].getAttribute('data-tool-result') === toolName) {
                        resultDivs[j].textContent = resultPreview;
                        resultDivs[j].classList.add('has-result');
                        break;
                    }
                }
            }
        }

        function endToolGroup() {
            if (!currentToolGroup) return;
            
            // Mark group as complete
            currentToolGroup.classList.add('complete');
            
            // Update title to final state
            const titleSpan = currentToolGroup.querySelector('.tool-group-title');
            if (toolCount === 1) {
                titleSpan.textContent = labels.tool_used_one;
            } else {
                titleSpan.textContent = labels.tool_used_many.replace('{count}', toolCount);
            }
            
            currentToolGroup = null;
            toolCount = 0;
        }

        function toggleToolGroup(groupId) {
            const group = document.getElementById(groupId);
            if (group) {
                group.classList.toggle('expanded');
            }
        }

        function clearMessages() {
            const messages = document.getElementById('messages');
            const welcome = document.getElementById('welcome');
            const thinking = document.getElementById('thinking');
            
            // Remove all children except welcome and thinking
            while (messages.firstChild) {
                messages.removeChild(messages.firstChild);
            }
            
            messages.appendChild(welcome);
            messages.appendChild(thinking);
            
            // Reset tool group state
            currentToolGroup = null;
            toolCount = 0;
            
            showWelcome();
            hideThinking();
        }

        function scrollToBottom() {
            const messages = document.getElementById('messages');
            setTimeout(function() {
                messages.scrollTop = messages.scrollHeight;
            }, 10);
        }

        function setTheme(colors) {
            const root = document.documentElement;
            if (colors.bg_primary) root.style.setProperty('--bg-primary', colors.bg_primary);
            if (colors.bg_secondary) root.style.setProperty('--bg-secondary', colors.bg_secondary);
            if (colors.bg_tertiary) root.style.setProperty('--bg-tertiary', colors.bg_tertiary);
            if (colors.text_primary) root.style.setProperty('--text-primary', colors.text_primary);
            if (colors.text_secondary) root.style.setProperty('--text-secondary', colors.text_secondary);
            if (colors.text_tertiary) root.style.setProperty('--text-tertiary', colors.text_tertiary);
            if (colors.border_default) root.style.setProperty('--border-default', colors.border_default);
            if (colors.accent_primary) root.style.setProperty('--accent-primary', colors.accent_primary);
            if (colors.interactive_primary) root.style.setProperty('--accent-primary', colors.interactive_primary);
            if (colors.interactive_primary_hover) root.style.setProperty('--accent-hover', colors.interactive_primary_hover);
            if (colors.user_bubble) root.style.setProperty('--user-bubble', colors.user_bubble);
            if (colors.interactive_secondary) root.style.setProperty('--assistant-bubble', colors.interactive_secondary);
            if (colors.assistant_bubble) root.style.setProperty('--assistant-bubble', colors.assistant_bubble);
        }

        // Expose functions to Python
        window.addMessage = addMessage;
        window.appendToMessage = appendToMessage;
        window.startStreaming = startStreaming;
        window.streamChunk = streamChunk;
        window.endStreaming = endStreaming;
        window.showThinking = showThinking;
        window.hideThinking = hideThinking;
        window.startThinkingBlock = startThinkingBlock;
        window.appendThinking = appendThinking;
        window.endThinkingBlock = endThinkingBlock;
        window.toggleThinkingBlock = toggleThinkingBlock;
        window.startToolGroup = startToolGroup;
        window.addToolUse = addToolUse;
        window.updateToolStatus = updateToolStatus;
        window.endToolGroup = endToolGroup;
        window.toggleToolGroup = toggleToolGroup;
        window.clearMessages = clearMessages;
        window.setWelcomeText = setWelcomeText;
        window.showWelcome = showWelcome;
        window.hideWelcome = hideWelcome;
        window.setTheme = setTheme;
        window.setLabels = setLabels;
        window.scrollToBottom = scrollToBottom;
    </script>
</body>
</html>
