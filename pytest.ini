[pytest]
testpaths = tests
pythonpath = source source/src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Otimizacoes de performance:
# -n auto: execucao paralela automatica (usa todos os cores disponiveis)
# --tb=short: traceback resumido
# --strict-markers: garante que apenas marcadores definidos sao usados
# --maxfail=5: para apos 5 falhas para economizar tempo em caso de erro
addopts = -v --tb=short -n auto --strict-markers --maxfail=5

# Environment variables
env = 
    QT_QPA_PLATFORM=offscreen

# Markers
markers =
    slow: marca testes lentos
    integration: marca testes de integração
    unit: marca testes unitários
    gui: marca testes que usam interface grafica

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
