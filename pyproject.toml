[project]
name = "DataPyn"
version = "1.55.0"
requires-python = ">=3.12"
dependencies = [
    # GUI Framework
    "PyQt6>=6.11.0",
    "PyQt6-WebEngine>=6.11.0",
    "QtAwesome>=1.4.0",
    "qt-material>=2.14",
    # Database Drivers
    "sqlalchemy>=2.0.50",
    "pymssql>=2.3.13",
    "pyodbc>=5.0.0",
    "mysql-connector-python>=9.7.0",
    "PyMySQL>=1.2.0",
    "psycopg2-binary>=2.9.12",
    # mariadb requires libmariadb-dev on Linux - use PyMySQL instead
    "databricks-sql-connector>=4.2.6",
    "databricks-sqlalchemy>=1.0.0",
    # Data Processing
    "pandas>=2.2.0,<3",
    "polars>=1.41.0",
    "pyarrow>=24.0.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.0",
    "fastexcel>=0.20.0",
    "jinja2>=3.1.0",
    # Utilities
    "python-dotenv>=1.2.2",
    "cryptography>=48.0.0",
    "keyring>=25.0.0",
    "requests>=2.33.0",
    "azure-identity>=1.17.0",
    # Code Formatting
    "ruff>=0.15.0",
    "sqlparse>=0.6.0",
    "sqlglot>=30.0.0",
    # Charts
    "matplotlib>=3.10.0",
    "plotly>=5.18.0",
    "jedi>=0.20.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "pytest-subtests>=0.13.0",
    "pytest-env>=1.6.0",
    "pytest-timeout>=2.3.0",
    # Security audit (CI + local: uv run pip-audit)
    "pip-audit>=2.9.0",
    # Release parser (scripts/datapyn_commit_parser.py + tests)
    "python-semantic-release>=10.5.3",
    # Build
    "pyinstaller>=6.20.0",
    "ruff>=0.15.17",
]

[tool.uv]
native-tls = true
override-dependencies = [
    "msgpack>=1.2.1",
    "click>=8.3.3",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "gitpython>=3.1.55",
    "pip>=26.2",
]


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "scripts/datapyn_commit_parser.py:DatapynCommitParser"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "refactor", "revert", "build"]
other_allowed_tags = ["chore", "ci", "docs", "style", "test"]
ignore_merge_commits = false
parse_squash_commits = true

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = []
preview = true
exclude = ["tests/*"]
